<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turntable Scratch v38</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#eef2f7;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100vw,560px);height:100%;display:flex;flex-direction:column;padding:9px 12px 11px;gap:6px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:15px;margin:0;letter-spacing:.08em}
#togglePlay,#syncBtn{border:1px solid #56606c;background:#151b23;color:#fff;border-radius:9px;padding:6px 15px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer}
#togglePlay.playing{border-color:#e06c75;background:#2a171b;color:#ffd6da}
.mode-toggle{display:flex;border:1px solid #3c4550;border-radius:8px;overflow:hidden;background:#10151c}
.mode-toggle button{border:0;background:transparent;color:#8f9aa7;font-size:10px;padding:5px 8px;cursor:pointer}
.mode-toggle button.active{background:#263140;color:#fff;font-weight:700}

.patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pat-btn{border:1px solid #444e5a;background:#131921;color:#cfd7e0;border-radius:8px;padding:5px 0;font-size:12px;font-weight:700;cursor:pointer}
.pat-btn.active{border-color:#7fb3ff;background:#1b2a3f;color:#fff}
.pat-btn.queued{border-color:#f0b45a;background:#2c2212;color:#ffdca8;animation:pulseQueued .9s infinite alternate}
@keyframes pulseQueued{from{opacity:.65}to{opacity:1}}

.controllers{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0;align-content:center}
.col{display:flex;flex-direction:column;gap:6px;min-height:0;justify-content:center}

/* コントローラー上部モニター */
.fx-monitor{
 background:#0c1118;border:1px solid #252f3d;border-radius:9px;
 padding:5px 7px;display:flex;flex-direction:column;gap:4px
}
.mon-item{display:flex;flex-direction:column;gap:2px;opacity:.55;transition:opacity .12s}
.mon-item.active{opacity:1}
.mon-head{display:flex;justify-content:space-between;align-items:center;font-size:9px;font-variant-numeric:tabular-nums}
.mon-name{font-weight:700;color:#cfd7e0}
.mon-item.active .mon-name{color:#7fb3ff}
.mon-item.warm.active .mon-name{color:#f6ad55}
.mon-val{color:#8f9aa7}
.mon-item.active .mon-val{color:#fff;font-weight:600}
.mon-bar{height:4px;background:#17202c;border-radius:3px;overflow:hidden;position:relative}
.mon-fill{height:100%;width:0%;background:#4a90e2;transition:width .05s linear}
.mon-item.active .mon-fill{background:#63b3ed}
.mon-item.warm.active .mon-fill{background:#f6ad55}

/* ===== v36: ブラウン管モニター ===== */
.crt{position:relative;width:100%;max-width:220px;margin:0 auto;aspect-ratio:10/9;border-radius:16px/14px;background:#000;overflow:hidden;
 border:1px solid #2a3039;box-shadow:inset 0 0 22px rgba(0,0,0,.9),0 0 0 3px #10141a,0 8px 18px rgba(0,0,0,.55)}
.crt.xy.live{box-shadow:inset 0 0 22px rgba(0,0,0,.9),0 0 16px rgba(255,179,71,.28),0 0 0 3px #10141a,0 8px 18px rgba(0,0,0,.55)}
.crt.tt.live{box-shadow:inset 0 0 22px rgba(0,0,0,.9),0 0 16px rgba(127,224,255,.28),0 0 0 3px #10141a,0 8px 18px rgba(0,0,0,.55)}
.crt canvas{position:absolute;inset:0;width:100%;height:100%;display:block;animation:crtFlick 3.1s infinite steps(1)}
.crt:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 1px,transparent 1px 3px)}
.crt:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
 background:radial-gradient(ellipse at center,rgba(255,255,255,.05) 0%,transparent 45%,rgba(0,0,0,.62) 100%)}
@keyframes crtFlick{0%{opacity:1}7%{opacity:.965}8%{opacity:1}52%{opacity:.98}53%{opacity:1}}
@media (max-height:700px){.crt{max-width:150px}}

/* コントローラー本体と直下のパッチボタンを密着させるグループ */
.ctl-unit{display:flex;flex-direction:column;gap:6px;align-items:center}
.ctl-stage{width:100%;height:min(41vw,194px);display:flex;align-items:center;justify-content:center;position:relative}

/* ターンテーブル＋すぐ横のHOLDボタン用ラッパー */
.tt-wrap{
 width:min(40vw,190px);height:min(40vw,190px);
 position:relative;display:flex;align-items:center;justify-content:center;
}
.platter{
 width:100%;height:100%;border-radius:50%;
 position:relative;touch-action:none;overflow:hidden;
 background:
 radial-gradient(circle at center,#111820 0 12%,#0a0d11 12.5% 15%,
 #171c22 15.5% 16%,#0b0e13 16.5% 30%,transparent 30.5%),
 repeating-radial-gradient(circle,#171c22 0 1px,#0a0d11 1px 5px);
 box-shadow:0 0 0 2px #303844,0 10px 24px #000;
}
.platter.held{
 box-shadow:0 0 0 2px #63b3ed,0 0 18px rgba(99,179,237,.35),0 10px 24px #000;
}
.platter:before{
 content:"";position:absolute;inset:7%;border-radius:50%;
 border:1px solid #39424e;
 background:repeating-conic-gradient(from 0deg,#11161c 0deg 2deg,#1b2128 2deg 4deg);
 opacity:.65;
}
.label{position:absolute;inset:32%;border-radius:50%;background:#202833;border:2px solid #4b5663;display:flex;align-items:center;justify-content:center;z-index:2}
.label span{font-size:9px;color:#aeb7c1;letter-spacing:.06em;font-weight:700;text-align:center}
.spindle{position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:#d9dee4;z-index:3;box-shadow:0 0 0 3px #161b21}
.marker{position:absolute;inset:0;z-index:4;pointer-events:none}
.marker:before{content:"";position:absolute;left:50%;top:5%;width:3.5px;height:17%;transform:translateX(-50%);background:#e9eef5;border-radius:4px}

/* ターンテーブルのすぐ外周右上に配置 */
#ttHoldBtn{
 position:absolute;top:0;right:-4px;z-index:6;
 border:1px solid #4a5568;background:rgba(15,20,28,.94);color:#a0aec0;
 border-radius:7px;padding:4px 7px;font-size:9px;font-weight:700;cursor:pointer;
 box-shadow:0 3px 10px rgba(0,0,0,.6);
}
#ttHoldBtn.on{
 border-color:#63b3ed;background:#152b40;color:#bee3f8;
}

.xy-pad{
 width:100%;height:min(40vw,190px);max-width:220px;
 border-radius:12px;position:relative;touch-action:none;overflow:hidden;
 background:
 linear-gradient(to right,rgba(127,179,255,.08) 1px,transparent 1px),
 linear-gradient(to bottom,rgba(127,179,255,.08) 1px,transparent 1px),
 radial-gradient(circle at 50% 50%,#16202c 0%,#0b0f15 100%);
 background-size:25% 25%,25% 25%,100% 100%;
 border:1px solid #3c4756;
 box-shadow:inset 0 0 24px rgba(0,0,0,.65),0 10px 24px rgba(0,0,0,.45);
}
.xy-pad.active{border-color:#f6ad55;box-shadow:inset 0 0 26px rgba(246,173,85,.16),0 0 16px rgba(246,173,85,.24)}
.xy-cross-x,.xy-cross-y{position:absolute;background:rgba(246,173,85,.32);pointer-events:none;display:none}
.xy-cross-x{left:0;right:0;height:1px;top:50%}
.xy-cross-y{top:0;bottom:0;width:1px;left:50%}
.xy-puck{
 position:absolute;width:20px;height:20px;border-radius:50%;
 transform:translate(-50%,-50%);left:50%;top:50%;
 background:#f6ad55;border:2px solid #fff;
 box-shadow:0 0 12px rgba(246,173,85,.85);
 pointer-events:none;z-index:2;opacity:.45;
}
.xy-pad.active .xy-puck{opacity:1}

#xyHoldOffBtn{
 position:absolute;top:6px;right:6px;z-index:5;
 border:1px solid #4a5568;background:rgba(15,20,28,.92);color:#a0aec0;
 border-radius:6px;padding:4px 7px;font-size:9px;font-weight:700;cursor:pointer;
}
#xyHoldOffBtn.lit{
 border-color:#f6ad55;background:#3a250b;color:#ffe3b8;
}

/* コントローラー直下の4連パッチボタン */
.sel-grid-4{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fx-sel{
 border:1px solid #394352;background:#131922;color:#aeb7c1;
 border-radius:7px;padding:7px 2px;font-size:10px;font-weight:700;
 cursor:pointer;text-align:center
}
.fx-sel.tt.on{border-color:#63b3ed;background:#152b40;color:#bee3f8}
.fx-sel.xy.on{border-color:#f6ad55;background:#33220d;color:#fbd38d}

.info-bpm{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0e131a;border:1px solid #262f3a;border-radius:9px;padding:5px 10px;font-size:11px;color:#8f9aa7}
.info-bpm b{color:#e8edf2;font-variant-numeric:tabular-nums}
#bpmDisplayBtn{border:1px solid #56606c;background:#18202b;color:#fff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.info-bpm input[type="range"]{flex:1;accent-color:#7fb3ff;height:18px;touch-action:pan-x;min-width:70px}
.status-line{font-size:10px;color:#7c8794;text-align:center;height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 3桁直接入力パッドモーダル */
.keypad-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50}
.keypad-backdrop.open{display:flex}
.keypad-box{width:min(88vw,300px);background:#121720;border:1px solid #465160;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px #000}
.keypad-screen{background:#090c11;border:1px solid #2e3744;border-radius:8px;padding:10px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.16em;color:#7fb3ff}
.keypad-sub{font-size:11px;color:#8f9aa7;text-align:center}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keypad-grid button{border:1px solid #3c4654;background:#19212d;color:#fff;border-radius:8px;padding:11px 0;font-size:16px;font-weight:600;cursor:pointer}
.keypad-grid button.act{background:#243247;border-color:#6ca2f0;font-size:13px}
.keypad-grid button.clr{background:#2a191d;border-color:#9e545c;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>BEAT</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="mode-toggle" title="パターン切り替えタイミング">
        <button id="modeNow" type="button" class="active">NOW</button>
        <button id="modeBar" type="button">NEXT</button>
      </div>
      <button id="syncBtn" type="button" style="padding:6px 10px">SYNC</button>
      <button id="togglePlay" type="button">START</button>
    </div>
  </div>

  <div class="patterns" role="group" aria-label="パターン展開">
    <button class="pat-btn active" data-pat="A" type="button">A</button>
    <button class="pat-btn" data-pat="B" type="button">B</button>
    <button class="pat-btn" data-pat="C" type="button">C</button>
    <button class="pat-btn" data-pat="D" type="button">D</button>
  </div>

  <div class="controllers">
    <!-- 左：ターンテーブル（SCR / RPT / STTR / SCRW） -->
    <div class="col">
      <div class="crt tt" id="ttCrt"><canvas></canvas></div>

      <div class="ctl-unit">
        <div class="ctl-stage">
          <div class="tt-wrap">
            <button id="ttHoldBtn" type="button" title="ターンテーブル位置ホールド切替">HOLD: OFF</button>
            <div class="platter" id="platter">
              <div class="marker" id="marker"></div>
              <div class="label"><span id="ttBadge">TT OFF</span></div>
              <div class="spindle"></div>
            </div>
          </div>
        </div>

        <div class="sel-grid-4" aria-label="ターンテーブルエフェクト選択">
          <button class="fx-sel tt" data-tt="scr" type="button">SCR</button>
          <button class="fx-sel tt" data-tt="repeat" type="button">RPT</button>
          <button class="fx-sel tt" data-tt="stutter" type="button">STTR</button>
          <button class="fx-sel tt" data-tt="screw" type="button">SCRW</button>
        </div>
      </div>
    </div>

    <!-- 右：XYパッド（LPF / HPF / BIT / FLG） -->
    <div class="col">
      <div class="crt xy" id="xyCrt"><canvas></canvas></div>

      <div class="ctl-unit">
        <div class="ctl-stage">
          <div class="xy-pad" id="xyPad">
            <button id="xyHoldOffBtn" type="button" title="XYホールド解除">HOLD OFF</button>
            <div class="xy-cross-x" id="xyCrossX"></div>
            <div class="xy-cross-y" id="xyCrossY"></div>
            <div class="xy-puck" id="xyPuck"></div>
          </div>
        </div>

        <div class="sel-grid-4" aria-label="XYパッドエフェクト選択">
          <button class="fx-sel xy" data-xy="lpf" type="button">LPF</button>
          <button class="fx-sel xy" data-xy="hpf" type="button">HPF</button>
          <button class="fx-sel xy" data-xy="bit" type="button">BIT</button>
          <button class="fx-sel xy" data-xy="flg" type="button">FLG</button>
        </div>
      </div>
    </div>
  </div>

  <div class="info-bpm">
    <span>PAT <b id="patEl">A</b> PH <b id="phaseEl">0.00</b></span>
    <button id="bpmDisplayBtn" type="button" title="タップして3桁入力">BPM <span id="bpm">140</span></button>
    <input id="bpmSlider" type="range" min="80" max="180" step="1" value="140" aria-label="BPMスライダー">
  </div>
  <div class="status-line" id="status">READY — コントローラーすぐ下のパッチボタンでFXを選択</div>
</div>

<!-- 3桁直接入力パッドモーダル -->
<div class="keypad-backdrop" id="keypadModal" role="dialog" aria-modal="true" aria-label="BPM 3桁入力">
  <div class="keypad-box">
    <div class="keypad-sub">BPM 3桁入力（2桁も可 / 80〜180）</div>
    <div class="keypad-screen" id="keypadScreen">---</div>
    <div class="keypad-grid">
      <button data-k="1" type="button">1</button>
      <button data-k="2" type="button">2</button>
      <button data-k="3" type="button">3</button>
      <button data-k="4" type="button">4</button>
      <button data-k="5" type="button">5</button>
      <button data-k="6" type="button">6</button>
      <button data-k="7" type="button">7</button>
      <button data-k="8" type="button">8</button>
      <button data-k="9" type="button">9</button>
      <button class="clr" id="kpClear" type="button">CLR</button>
      <button data-k="0" type="button">0</button>
      <button class="act" id="kpOk" type="button">OK</button>
    </div>
  </div>
</div>

 <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let ctx, master, beatGain, scratchGain;
let lpfNode, hpfNode, bitNode, bitTrimGain, flgDelay, flgFb, flgWet, flgLfo, flgLfoGain, dryBus, analyser;
let BPM=140;
let bufferBPM=140;

const _F={D5:587.33,E5:659.25,F5s:739.99,G5:783.99,A5:880,B5:987.77,D6:1174.66,A4:440};

const PATTERNS={
  A:{
    bars:['7/8','12/8'],
    barDef:{
      '7/8':{ steps:14, starts:[0,6,10],
        kick:[0,3,10], snare:[6], ghost:[9,13], open:[12], wood:[8], fill:[],
        hi:[_F.D5,_F.F5s,_F.A5,_F.D6,_F.A5,_F.F5s, _F.E5,_F.G5,_F.B5,_F.G5, _F.D5,_F.A5,_F.B5,_F.A5],
        low:[146.83,164.81,146.83] },
      '12/8':{ steps:24, starts:[0,6,12,18],
        kick:[0,3,12,16], snare:[6,18], ghost:[15], open:[10], wood:[9], fill:[21,22,23],
        hi:[_F.D5,_F.F5s,_F.A5,_F.D6,_F.A5,_F.F5s, _F.E5,_F.G5,_F.B5,_F.D6,_F.B5,_F.G5,
            _F.F5s,_F.A5,_F.D6,_F.B5,_F.A5,_F.F5s, _F.B5,_F.G5,_F.E5,_F.G5,_F.B5,_F.D6],
        low:[146.83,164.81,196.00,146.83] }
    },
    pad:[293.66,440,659.25]
  },
  B:{
    bars:['7/8','12/8'],
    barDef:{
      '7/8':{ steps:14, starts:[0,6,10],
        kick:[0,3,6,10,12], snare:[4,10], ghost:[2,8,13], open:[5,12], wood:[7,11], fill:[13],
        hi:[_F.A5,_F.D6,_F.A5,_F.F5s,_F.A5,_F.D6, _F.B5,_F.G5,_F.E5,_F.G5, _F.D6,_F.A5,_F.B5,_F.D6],
        low:[146.83,196.00,164.81] },
      '12/8':{ steps:24, starts:[0,6,12,18],
        kick:[0,3,6,9,12,15,18,21], snare:[4,10,16,22], ghost:[2,8,14,20], open:[5,17], wood:[7,13,19], fill:[22,23],
        hi:[_F.D6,_F.A5,_F.F5s,_F.D6,_F.A5,_F.F5s, _F.E5,_F.B5,_F.G5,_F.D6,_F.B5,_F.G5,
            _F.F5s,_F.D6,_F.A5,_F.B5,_F.A5,_F.F5s, _F.D6,_F.B5,_F.G5,_F.E5,_F.G5,_F.A5],
        low:[146.83,164.81,196.00,220.00] }
    },
    pad:[293.66,440,587.33]
  },
  C:{
    bars:['7/8','12/8'],
    barDef:{
      '7/8':{ steps:14, starts:[0,6,10],
        kick:[0,10], snare:[6], ghost:[2,5,9,13], open:[13], wood:[3,6,8,11], fill:[],
        hi:[_F.E5,_F.A4,_F.G5,_F.A4,_F.F5s,_F.A4, _F.B5,_F.A4,_F.G5,_F.A4, _F.E5,_F.A4,_F.D5,_F.A4],
        low:[146.83,146.83,164.81] },
      '12/8':{ steps:24, starts:[0,6,12,18],
        kick:[0,12,18], snare:[6,18], ghost:[3,9,15,21], open:[11,23], wood:[2,5,8,14,20], fill:[21,22,23],
        hi:[_F.A5,_F.E5,_F.G5,_F.E5,_F.F5s,_F.E5, _F.B5,_F.G5,_F.D6,_F.B5,_F.G5,_F.E5,
            _F.A5,_F.F5s,_F.D6,_F.A5,_F.F5s,_F.E5, _F.G5,_F.E5,_F.B5,_F.G5,_F.E5,_F.D5],
        low:[196.00,164.81,146.83,164.81] }
    },
    pad:[220.00,440,659.25]
  },
  D:{
    bars:['7/8','12/8'],
    barDef:{
      '7/8':{ steps:14, starts:[0,6,10],
        kick:[0,3,6,9,12], snare:[5,11], ghost:[1,7,13], open:[4,10], wood:[2,8], fill:[12,13],
        hi:[_F.D6,_F.B5,_F.A5,_F.G5,_F.F5s,_F.E5, _F.D6,_F.A5,_F.B5,_F.G5, _F.A5,_F.F5s,_F.D5,_F.E5],
        low:[164.81,196.00,220.00] },
      '12/8':{ steps:24, starts:[0,6,12,18],
        kick:[0,4,8,12,16,20], snare:[6,14,18], ghost:[2,10,15,22], open:[5,11,17,23], wood:[3,9,15,21], fill:[20,21,22,23],
        hi:[_F.D6,_F.A5,_F.F5s,_F.D6,_F.B5,_F.G5, _F.E5,_F.G5,_F.B5,_F.D6,_F.B5,_F.G5,
            _F.F5s,_F.A5,_F.D6,_F.B5,_F.A5,_F.F5s, _F.E5,_F.G5,_F.B5,_F.D6,_F.B5,_F.A5],
        low:[146.83,220.00,196.00,164.81] }
    },
    pad:[293.66,440,739.99]
  }
};

let currentPat='A', queuedPat=null, switchAtLoopEnd=false;

function activeSpec(){ return PATTERNS[currentPat]; }
function totalStepsOf(spec){ return spec.bars.reduce((a,k)=>a+spec.barDef[k].steps,0); }
function loopDurOf(spec, bpm=bufferBPM){ return totalStepsOf(spec)*60/(4*bpm); }
function barOffsetsOf(spec){
  let o=0;
  return spec.bars.map(k=>{const r={def:spec.barDef[k],o}; o+=spec.barDef[k].steps; return r;});
}
function tempoRatio(){ return BPM / bufferBPM; }

let beatBuf, scratchBuf, scratchRevBuf, t0=0;
let playing=false, dragging=false, scratchingActive=false;
let angle=0, ttDeltaAngle=0;
let lastT=0, velocity=0, lastPointerAngle=0, dir=1;

const ttSel={ scr:false, repeat:false, stutter:false, screw:false };
const xySel={ lpf:false, hpf:false, bit:false, flg:false };

// ===== v33 設定値 =====
const REPEAT_DIVS=[2,4,8,16,32,64,128];          // リピートの分割数（1小節÷N）。上限 32→128
const STUTTER_DIVS=[4,8,16,32,64,128,256];       // スタッターの分割数。上限 64→256
const REPEAT_HOME_IDX=2, STUTTER_HOME_IDX=2;     // v34: ホームに戻ったときの値（リピート1/8・スタッター1/16）
const ENC_STEP=24*Math.PI/180;                   // 円盤を何度回すと1段動くか（相対方式）
const SCREW_SLIP=true;                           // true: スクリューを離したらビートに合う位置へ戻す
const Q_MAX=12;                                  // フィルターのQ上限（Web Audioではdb単位）
const MASTER_LEVEL=.9;
const ttOrder=[], xyOrder=[];                    // エフェクトを選んだ順（最後が最新）

const state={
  ttHoldEnabled:false,
  ttLatched:false,
  xyX:0.5, xyY:0.5, xyHolding:false, xyDragging:false,
  lpfFreq:22000, lpfQ:1.5, lpfNorm:0,
  hpfFreq:10, hpfQ:1.5, hpfNorm:0,
  bitX:0, bitY:0, bitNorm:0,
  flgRate:1.2, flgDepth:0, flgNorm:0,
  scrNorm:0, scrSpeedText:'0.00',
  repeatDiv:8, repeatPos01:0.5, repeatIdx:2,      // v33: 値は保持して回した分だけ上げ下げ（相対）
  stutterDiv:16, stutterPos01:0.5, stutterIdx:2,
  encAcc:0,
  screwRate:1.0, screwPos01:0.5, screwActive:false
};

function makeExtremeBitCurve(bitAmt01, foldAmt01){
  const n=1024, curve=new Float32Array(n);
  if(bitAmt01<=0.01 && foldAmt01<=0.01){
    for(let i=0;i<n;i++) curve[i]=(i/(n-1))*2-1;
    return curve;
  }
  const steps = Math.max(2, Math.round(32 * Math.pow(1 - bitAmt01, 2.6) + 2));
  const foldGain = 1 + foldAmt01 * 5.2;
  const intensity = Math.min(1, Math.max(bitAmt01, foldAmt01));
  const maxOut = 1.0 - intensity * 0.38;
  for(let i=0;i<n;i++){
    const raw = (i/(n-1))*2 - 1;
    let folded = foldAmt01>0.01 ? Math.sin(raw * Math.PI * 0.5 * foldGain) : raw;
    let q = Math.round(folded * steps) / steps;
    curve[i] = Math.max(-maxOut, Math.min(maxOut, q * maxOut));
  }
  return curve;
}

function setupFxChain(){
  dryBus=ctx.createGain(); dryBus.gain.value=1;

  lpfNode=ctx.createBiquadFilter();
  lpfNode.type='lowpass';
  lpfNode.frequency.value=22000;
  lpfNode.Q.value=1.5;

  hpfNode=ctx.createBiquadFilter();
  hpfNode.type='highpass';
  hpfNode.frequency.value=10;
  hpfNode.Q.value=1.5;

  bitNode=ctx.createWaveShaper();
  bitNode.curve=makeExtremeBitCurve(0,0);
  bitNode.oversample='none';

  bitTrimGain=ctx.createGain();
  bitTrimGain.gain.value=1.0;

  flgDelay=ctx.createDelay(0.05);
  flgDelay.delayTime.value=0.0045;
  flgFb=ctx.createGain();
  flgFb.gain.value=0.84;
  flgWet=ctx.createGain();
  flgWet.gain.value=0;
  flgLfo=ctx.createOscillator();
  flgLfo.type='triangle';
  flgLfo.frequency.value=1.4;
  flgLfoGain=ctx.createGain();
  flgLfoGain.gain.value=0.0038;
  flgLfo.connect(flgLfoGain);
  flgLfoGain.connect(flgDelay.delayTime);
  flgLfo.start();

  flgDelay.connect(flgFb);
  flgFb.connect(flgDelay);
  flgDelay.connect(flgWet);

  dryBus.connect(lpfNode);
  lpfNode.connect(hpfNode);
  hpfNode.connect(bitNode);
  bitNode.connect(bitTrimGain);
  // v33: 出口の安全装置。共振(Q)やフランジャーのフィードバックで大きなピークが出ても 0.93 を超えない
  const safetyClip=ctx.createWaveShaper();
  { const n=2049, c=new Float32Array(n), knee=.7;
    for(let i=0;i<n;i++){
      const x=i/(n-1)*2-1, ax=Math.abs(x);
      const y=ax<=knee?ax:knee+(1-knee)*Math.tanh((ax-knee)/(1-knee));
      c[i]=x<0?-y:y;
    }
    safetyClip.curve=c; safetyClip.oversample='none'; }
  safetyClip.connect(ctx.destination);
  bitTrimGain.connect(flgDelay);
  bitTrimGain.connect(safetyClip);
  flgWet.connect(safetyClip);

  master=ctx.createGain(); master.gain.value=.9; master.connect(dryBus);
  // v36: モニター用にエフェクト前の音を解析（描画側でフィルター特性などを掛けて「削れる」様子を見せる）
  analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=.65;
  analyser.minDecibels=-90; analyser.maxDecibels=-20; master.connect(analyser);
  beatGain=ctx.createGain(); beatGain.gain.value=.26; beatGain.connect(master);
  scratchGain=ctx.createGain(); scratchGain.gain.value=.9; scratchGain.connect(master);
  applyXyAudio();
}

function applyXyAudio(){
  if(!ctx)return;
  const t=ctx.currentTime;

  if(xySel.lpf && state.xyHolding){
    const xInv = 1 - state.xyX;
    const freq = 20000 * Math.pow(95/20000, Math.pow(xInv, 0.78));
    const q = 1.5 + Math.pow(state.xyY, 1.3) * (Q_MAX-1.5);
    state.lpfFreq=freq;
    state.lpfQ=q;
    state.lpfNorm=(xInv*0.6 + state.xyY*0.4);
    lpfNode.frequency.setTargetAtTime(freq, t, 0.004);
    lpfNode.Q.setTargetAtTime(q, t, 0.005);
  }else{
    state.lpfFreq=22000; state.lpfQ=1.5; state.lpfNorm=0;
    lpfNode.frequency.setTargetAtTime(22000, t, 0.015);
    lpfNode.Q.setTargetAtTime(1.5, t, 0.015);
  }

  if(xySel.hpf && state.xyHolding){
    const freq = 20 * Math.pow(4200/20, Math.pow(state.xyX, 0.85));
    const q = 1.5 + Math.pow(state.xyY, 1.3) * (Q_MAX-1.5);
    state.hpfFreq=freq;
    state.hpfQ=q;
    state.hpfNorm=(state.xyX*0.6 + state.xyY*0.4);
    hpfNode.frequency.setTargetAtTime(freq, t, 0.004);
    hpfNode.Q.setTargetAtTime(q, t, 0.005);
  }else{
    state.hpfFreq=10; state.hpfQ=1.5; state.hpfNorm=0;
    hpfNode.frequency.setTargetAtTime(10, t, 0.015);
    hpfNode.Q.setTargetAtTime(1.5, t, 0.015);
  }

  if(xySel.bit && state.xyHolding){
    state.bitX=state.xyX;
    state.bitY=state.xyY;
    state.bitNorm=(state.xyX*0.5 + state.xyY*0.5);
    bitNode.curve = makeExtremeBitCurve(state.xyX, state.xyY);
    const compGain = 0.62 - (state.xyX*0.20 + state.xyY*0.18);
    bitTrimGain.gain.setTargetAtTime(Math.max(0.24, compGain), t, 0.010);
  }else{
    state.bitX=0; state.bitY=0; state.bitNorm=0;
    bitNode.curve = makeExtremeBitCurve(0,0);
    bitTrimGain.gain.setTargetAtTime(1.0, t, 0.015);
  }

  if(xySel.flg && state.xyHolding){
    const rate = 0.25 + Math.pow(state.xyX, 1.4) * 8.5;
    const depth = state.xyY;
    state.flgRate=rate;
    state.flgDepth=depth;
    state.flgNorm=(state.xyX*0.4 + depth*0.6);
    flgWet.gain.setTargetAtTime(Math.min(0.95, 0.25 + depth*0.7), t, 0.012);
    flgLfo.frequency.setTargetAtTime(rate, t, 0.015);
    flgLfoGain.gain.setTargetAtTime(0.0008 + depth*0.004, t, 0.015);
    flgFb.gain.setTargetAtTime(0.55 + depth*0.35, t, 0.015);
  }else{
    state.flgDepth=0; state.flgNorm=0;
    flgWet.gain.setTargetAtTime(0, t, 0.015);
  }
}

let momBeatSrc=null, momBeatGain=null;
let momUwaSrc=null, momUwaGain=null;
let stutterTimer=null, activeMomMode=null, activeMomDiv=0;

// 選んだ順で最新の「リピート／スタッター」（同時に選ぶと最後に選んだ方だけ動く）
function topMomentary(){
  for(let i=ttOrder.length-1;i>=0;i--){
    const k=ttOrder[i];
    if((k==='repeat'||k==='stutter') && ttSel[k]) return k;
  }
  return null;
}

function stopMomentarySourcesOnly(){
  if(momBeatSrc){
    const sB=momBeatSrc, gB=momBeatGain; momBeatSrc=null; momBeatGain=null;
    const t=ctx.currentTime;
    gB.gain.cancelScheduledValues(t);
    gB.gain.setTargetAtTime(0,t,0.005);
    try{sB.stop(t+0.04)}catch{}
  }
  if(momUwaSrc){
    const sU=momUwaSrc, gU=momUwaGain; momUwaSrc=null; momUwaGain=null;
    const t=ctx.currentTime;
    gU.gain.cancelScheduledValues(t);
    gU.gain.setTargetAtTime(0,t,0.005);
    try{sU.stop(t+0.04)}catch{}
  }
}

// スタッターのゲート（master音量の自動化）を止めて、音量を元に戻す
function stopStutterGate(){
  if(stutterTimer){ clearInterval(stutterTimer); stutterTimer=null; }
  if(ctx && master){
    const t=ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(MASTER_LEVEL,t,0.004);
  }
}

function restoreNormalGains(){
  if(ctx && playing){
    if(beatSrcGain) beatSrcGain.gain.setTargetAtTime(1, ctx.currentTime, 0.012);
    if(uwaGain && !scratchingActive) uwaGain.gain.setTargetAtTime(UWA_LEVEL, ctx.currentTime, 0.012);
  }
}

function stopMomentaryAudio(){
  stopStutterGate();
  stopMomentarySourcesOnly();
  activeMomMode=null;
  activeMomDiv=0;
  restoreNormalGains();
}

function updateRepeatEngine(div){
  if(!ctx||!playing||!beatBuf||!scratchBuf)return;
  const cleanDiv=Math.max(2, Math.min(128, Math.round(div)));
  if(activeMomMode==='repeat' && activeMomDiv===cleanDiv && momBeatSrc) return;
  stopStutterGate();
  stopMomentarySourcesOnly();

  activeMomMode='repeat';
  activeMomDiv=cleanDiv;
  state.repeatDiv=cleanDiv;

  const dur=beatBuf.duration;
  const beatSec=60/BPM;
  const loopLen=Math.max(0.006, Math.min(dur*0.5, (beatSec*4)/cleanDiv));
  // v33: ループの始点を「いま鳴っている位置を含む区切り」の頭にそろえる（リズムの格子に乗る）
  const posSec=currentPhase()*dur;
  const offset=Math.max(0, Math.min(dur-loopLen-0.001, Math.floor(posSec/loopLen)*loopLen));
  const rate=state.screwActive ? Math.max(0.08, tempoRatio()*state.screwRate) : tempoRatio();

  const sB=ctx.createBufferSource();
  sB.buffer=beatBuf;
  sB.loop=true;
  sB.loopStart=offset;
  sB.loopEnd=offset+loopLen;
  sB.playbackRate.value=rate;
  const gB=ctx.createGain(); gB.gain.value=1.0;
  sB.connect(gB); gB.connect(beatGain);
  sB.start(0, offset);
  momBeatSrc=sB; momBeatGain=gB;
  if(beatSrcGain) beatSrcGain.gain.setTargetAtTime(0.02, ctx.currentTime, 0.006);

  if(!scratchingActive){
    const sU=ctx.createBufferSource();
    sU.buffer=scratchBuf;
    sU.loop=true;
    sU.loopStart=offset;
    sU.loopEnd=offset+loopLen;
    sU.playbackRate.value=rate;
    const gU=ctx.createGain(); gU.gain.value=UWA_LEVEL;
    sU.connect(gU); gU.connect(scratchGain);
    sU.start(0, offset);
    momUwaSrc=sU; momUwaGain=gU;
    if(uwaGain) uwaGain.gain.setTargetAtTime(0.01, ctx.currentTime, 0.006);
  }
}

// v33: スタッター＝音全体のゲート（刻み）。タイマーで音を作り直す方式をやめ、
// オーディオ時計に先読みで音量の開閉を予約する。細かい分割でも安定し、ビートの格子(t0基準)にそろう。
function updateStutterEngine(div){
  if(!ctx||!playing)return;
  const cleanDiv=Math.max(4, Math.min(256, Math.round(div)));
  if(activeMomMode==='stutter' && activeMomDiv===cleanDiv) return;
  stopStutterGate();
  stopMomentarySourcesOnly();
  restoreNormalGains();               // リピートから切り替えたとき用

  activeMomMode='stutter';
  activeMomDiv=cleanDiv;
  state.stutterDiv=cleanDiv;

  const sliceLen=(60/BPM*4)/cleanDiv;
  const att=Math.min(0.002, sliceLen*.2), rel=Math.min(0.004, sliceLen*.25), hold=sliceLen*.72;
  const now=ctx.currentTime;
  master.gain.cancelScheduledValues(now);
  let next=t0+Math.ceil((now+0.004-t0)/sliceLen)*sliceLen;
  const tick=()=>{
    if(!ctx||!playing||activeMomMode!=='stutter')return;
    const horizon=ctx.currentTime+0.12;
    const g=master.gain;
    while(next<horizon){
      g.setValueAtTime(0.0001,next);
      g.linearRampToValueAtTime(MASTER_LEVEL,next+att);
      g.setValueAtTime(MASTER_LEVEL,next+hold);
      g.linearRampToValueAtTime(0.0001,next+hold+rel);
      next+=sliceLen;
    }
  };
  tick();
  stutterTimer=setInterval(tick,25);
}

// 円盤を回した分だけ、最新のリピート／スタッターの段を上げ下げする（時計回り＝細かく）
function ttEncoder(da){
  const m=topMomentary();
  if(!m) return;
  state.encAcc+=da;
  const n=Math.trunc(state.encAcc/ENC_STEP);
  if(!n) return;
  state.encAcc-=n*ENC_STEP;
  if(m==='repeat') state.repeatIdx=Math.max(0,Math.min(REPEAT_DIVS.length-1,state.repeatIdx+n));
  else state.stutterIdx=Math.max(0,Math.min(STUTTER_DIVS.length-1,state.stutterIdx+n));
}

// スクリューを離したとき、ビートに合う位置へ戻す
function resyncToTimeline(){
  const now=ctx.currentTime, p=currentPhase();
  withPendingKept(()=>{
    scheduleBeat(now,p,true);
    if(!scratchingActive) startUwaNormal(now,p,true);
  });
  if(activeMomMode==='repeat'){
    if(beatSrcGain) beatSrcGain.gain.setTargetAtTime(0.02, now, 0.006);
    if(uwaGain) uwaGain.gain.setTargetAtTime(0.01, now, 0.006);
  }
  lastLoopPhase=p;
}

function applyScrewAndTempo(){
  if(!ctx)return;
  const t=ctx.currentTime;
  const base=tempoRatio();
  const targetRate = state.screwActive ? Math.max(0.08, base * state.screwRate) : base;
  if(beatSrc) beatSrc.playbackRate.setTargetAtTime(targetRate, t, 0.015);
  if(uwaSrc && !scratchingActive) uwaSrc.playbackRate.setTargetAtTime(targetRate, t, 0.015);
  if(momBeatSrc) momBeatSrc.playbackRate.setTargetAtTime(targetRate, t, 0.015);
  if(momUwaSrc) momUwaSrc.playbackRate.setTargetAtTime(targetRate, t, 0.015);
}

function ttSignedPosition01(){
  const norm = 0.5 + (ttDeltaAngle / (Math.PI * 1.1));
  return Math.max(0, Math.min(1, norm));
}

function isTtFxEngaged(){
  return dragging || (state.ttHoldEnabled && state.ttLatched);
}

function updateMonitors(){
  const setMon=(id, active, pct, text)=>{ monView[id]={active, pct:Math.max(0,Math.min(100,pct)), text}; };

  const lpfActive = xySel.lpf && state.xyHolding;
  setMon('lpf', lpfActive, lpfActive ? state.lpfNorm*100 : 0,
    !xySel.lpf ? 'OFF' : lpfActive ? `${state.lpfFreq>=1000?(state.lpfFreq/1000).toFixed(1)+'k':Math.round(state.lpfFreq)+'Hz'} Q${state.lpfQ.toFixed(1)}` : 'HOLD STANDBY');

  const hpfActive = xySel.hpf && state.xyHolding;
  setMon('hpf', hpfActive, hpfActive ? state.hpfNorm*100 : 0,
    !xySel.hpf ? 'OFF' : hpfActive ? `${Math.round(state.hpfFreq)}Hz Q${state.hpfQ.toFixed(1)}` : 'HOLD STANDBY');

  const bitActive = xySel.bit && state.xyHolding;
  setMon('bit', bitActive, bitActive ? state.bitNorm*100 : 0,
    !xySel.bit ? 'OFF' : bitActive ? `B${Math.round(state.bitX*100)} F${Math.round(state.bitY*100)}` : 'HOLD STANDBY');

  const flgActive = xySel.flg && state.xyHolding;
  setMon('flg', flgActive, flgActive ? state.flgNorm*100 : 0,
    !xySel.flg ? 'OFF' : flgActive ? `${state.flgRate.toFixed(1)}Hz ${Math.round(state.flgDepth*100)}%` : 'HOLD STANDBY');

  const engaged = isTtFxEngaged();

  const scrOn = ttSel.scr && scratchingActive;
  setMon('scr', scrOn, scrOn ? Math.min(100, state.scrNorm*100) : 0,
    !ttSel.scr ? 'OFF' : scrOn ? `${state.scrSpeedText}x ${dir>0?'▶':'◀'}` : 'STANDBY');

  const rptOn = topMomentary()==='repeat' && engaged;
  setMon('repeat', rptOn, state.repeatIdx/(REPEAT_DIVS.length-1)*100,
    !ttSel.repeat ? 'OFF' : rptOn ? `1/${REPEAT_DIVS[state.repeatIdx]}` : `STANDBY 1/${REPEAT_DIVS[state.repeatIdx]}`);

  const sttrOn = topMomentary()==='stutter' && engaged;
  setMon('stutter', sttrOn, state.stutterIdx/(STUTTER_DIVS.length-1)*100,
    !ttSel.stutter ? 'OFF' : sttrOn ? `1/${STUTTER_DIVS[state.stutterIdx]}` : `STANDBY 1/${STUTTER_DIVS[state.stutterIdx]}`);

  const scrwOn = ttSel.screw && state.screwActive;
  setMon('screw', scrwOn, scrwOn ? state.screwPos01*100 : 50,
    !ttSel.screw ? 'OFF' : scrwOn ? `${state.screwRate.toFixed(2)}x (${state.screwRate>=1?'ACCEL':'SLOW'})` : 'STANDBY');

  const activeList=Object.entries(ttSel).filter(([,v])=>v).map(([k])=>k.toUpperCase());
  ttBadge.textContent = activeList.length ? activeList.join('+') : 'TT OFF';

  ttHoldBtn.textContent = state.ttHoldEnabled ? 'HOLD: ON' : 'HOLD: OFF';
  ttHoldBtn.classList.toggle('on', state.ttHoldEnabled);
  platter.classList.toggle('held', state.ttHoldEnabled && state.ttLatched);

  xyHoldOffBtn.classList.toggle('lit', state.xyHolding);
}

function evaluateEffects(){
  applyXyAudio();

  const engaged = isTtFxEngaged();
  const pos01 = ttSignedPosition01();
  const mom = engaged ? topMomentary() : null;

  // リピート／スタッター：値は state.*Idx に保持（相対）。最後に選んだ方だけが動く
  if(mom==='repeat'){
    state.repeatDiv = REPEAT_DIVS[state.repeatIdx];
    state.repeatPos01 = state.repeatIdx/(REPEAT_DIVS.length-1);
    updateRepeatEngine(state.repeatDiv);
  }else if(activeMomMode==='repeat'){
    stopMomentaryAudio();
  }
  if(mom==='stutter'){
    state.stutterDiv = STUTTER_DIVS[state.stutterIdx];
    state.stutterPos01 = state.stutterIdx/(STUTTER_DIVS.length-1);
    updateStutterEngine(state.stutterDiv);
  }else if(activeMomMode==='stutter'){
    stopMomentaryAudio();
  }

  // スクリュー：触り始めからの回転量で速さが決まる（従来どおり）
  const wasScrew = state.screwActive;
  if(ttSel.screw && engaged){
    state.screwPos01 = pos01;
    state.screwActive = true;
    if(pos01 < 0.5){
      const t = pos01 / 0.5;
      state.screwRate = 0.08 + Math.pow(t, 1.2) * 0.92;
    }else{
      const t = (pos01 - 0.5) / 0.5;
      state.screwRate = 1.0 + t * 0.85;
    }
  }else{
    state.screwActive = false;
    state.screwRate = 1.0;
    state.screwPos01 = 0.5;
  }
  if(wasScrew && !state.screwActive && SCREW_SLIP && playing && ctx) resyncToTimeline();
  applyScrewAndTempo();

  updateMonitors();
  syncFx();
}

ttHoldBtn.addEventListener('pointerdown',(e)=>{
  e.stopPropagation();
});
ttHoldBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  state.ttHoldEnabled = !state.ttHoldEnabled;
  if(!state.ttHoldEnabled){
    state.ttLatched = false;
    if(!dragging){ ttDeltaAngle = 0; resetTtParams(); returnMarkerHome(); }
  }
  evaluateEffects();
});

document.querySelectorAll('.fx-sel.tt').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const key=btn.dataset.tt;
    ttSel[key]=!ttSel[key];
    { const i=ttOrder.indexOf(key); if(i>=0) ttOrder.splice(i,1); if(ttSel[key]) ttOrder.push(key); }
    btn.classList.toggle('on', ttSel[key]);
    if(key==='scr' && !ttSel.scr && scratchingActive){
      exitScratchMode();
    }
    evaluateEffects();
  });
});

document.querySelectorAll('.fx-sel.xy').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const key=btn.dataset.xy;
    xySel[key]=!xySel[key];
    { const i=xyOrder.indexOf(key); if(i>=0) xyOrder.splice(i,1); if(xySel[key]) xyOrder.push(key); }
    btn.classList.toggle('on', xySel[key]);
    evaluateEffects();
  });
});

function updateXyVisual(){
  const px=state.xyX*100;
  const py=(1-state.xyY)*100;
  xyPuck.style.left=`${px}%`;
  xyPuck.style.top=`${py}%`;
  xyCrossX.style.top=`${py}%`;
  xyCrossY.style.left=`${px}%`;
  const show=state.xyHolding?'block':'none';
  xyCrossX.style.display=show;
  xyCrossY.style.display=show;
  xyPad.classList.toggle('active', state.xyHolding);
}

  updateXyVisual();
  evaluateEffects();
}

// ===== v35: 音色は1回だけ作って使い回し、並べるだけでループを組む =====
// （以前はパターンを作るたびに全ての音を計算していて約2秒かかっていた）
let HITS=null;
function getHits(){
  if(HITS && HITS.sr===ctx.sampleRate) return HITS;
  const sr=ctx.sampleRate, TAU=Math.PI*2;
  let seed=12345;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/2147483648-1; };
  const mk=(sec,fn)=>{ const len=Math.floor(sec*sr), a=new Float32Array(len); for(let i=0;i<len;i++) a[i]=fn(i/sr); return a; };
  const H={sr, notes:new Map(), tom:{}};
  { let ph=0; H.kick=mk(.3,x=>{ ph+=TAU*(44+130*Math.exp(-x*30))/sr;
      return (Math.tanh(4*Math.sin(ph))*Math.exp(-x*10)+rnd()*Math.exp(-x*350)*.5)*.95; }); }
  H.snare=mk(.24,x=>{
    const v=rnd()*Math.exp(-x*17)*.7+Math.sin(TAU*190*x)*Math.exp(-x*22)*.5+Math.sin(TAU*330*x)*Math.exp(-x*22)*.3
            +Math.sin(TAU*873*x)*Math.exp(-x*20)*.12;
    return Math.tanh(3.2*v)*.85; });
  for(const f of [220,165,120]){ let ph=0;
    H.tom[f]=mk(.25,x=>{ ph+=TAU*f*(1+.35*Math.exp(-x*30))/sr; return Math.tanh(3*Math.sin(ph))*Math.exp(-x*9)*.8; }); }
  const hat=(open)=>{ let prev=0; const dc=open?22:100;
    return mk(open?.16:.04,x=>{ const nz=rnd(), hp=nz-prev; prev=nz;
      const v=hp*Math.exp(-x*dc)*.3+(Math.sin(TAU*6200*x)+Math.sin(TAU*8300*x))*Math.exp(-x*dc*.9)*.05;
      return Math.tanh(2*v)*.8; }); };
  H.hatC=hat(false); H.hatO=hat(true);
  { let prev=0; H.crash=mk(.9,x=>{ const nz=rnd(), hp=nz-prev; prev=nz;
      let v=hp*Math.exp(-x*4.5)*.28;
      for(const f of [3400,5200,7100,9300]) v+=Math.sin(TAU*f*x)*Math.exp(-x*5)*.035;
      return Math.tanh(2.2*v)*.9; }); }
  H.wood=mk(.05,x=>(Math.sin(TAU*1250*x)*.5+Math.sin(TAU*2100*x)*.2)*Math.exp(-x*90));
  HITS=H; return H;
}
function getNote(f,decay,hn,len){           // ウワモノの1音（音程ごとに1回だけ作る）
  const H=getHits(), key=f+'|'+decay+'|'+hn+'|'+len;
  let a=H.notes.get(key); if(a) return a;
  const sr=H.sr, TAU=Math.PI*2, L2=Math.floor(len*sr), w=[];
  for(let k=1;k<=hn;k++) w[k]=1/Math.pow(k,1.3);
  a=new Float32Array(L2);
  for(let i=0;i<L2;i++){
    const x=i/sr, env=Math.min(1,x/.002)*Math.exp(-x*decay);
    let v=0; for(let k=1;k<=hn;k++) v+=Math.sin(TAU*f*k*x)*w[k];
    a[i]=Math.tanh(1.1*v)*env;
  }
  H.notes.set(key,a); return a;
}
// 音を amp 倍してループに加える。ループの終わりを越えた余韻は先頭へ回り込ませる
function addHit(dst,n,start,hit,amp){
  let idx=start%n; const len=hit.length;
  for(let i=0;i<len;i++){ dst[idx]+=hit[i]*amp; if(++idx===n) idx=0; }
}

function makeBeatBuffer(spec=activeSpec(), bpm=BPM){
  const sr=ctx.sampleRate, n=Math.floor(sr*loopDurOf(spec,bpm)), H=getHits();
  const b=ctx.createBuffer(2,n,sr);
  const L=b.getChannelData(0), R=b.getChannelData(1);
  const step=n/totalStepsOf(spec);
  const at=(s)=>Math.floor(s*step);
  barOffsetsOf(spec).forEach(({def,o},bi)=>{
    for(const s of def.kick) addHit(L,n,at(o+s),H.kick,1);
    for(const s of def.snare) addHit(L,n,at(o+s),H.snare,1);
    for(const s of def.ghost) addHit(L,n,at(o+s),H.snare,.35);
    def.fill.forEach((s,j)=>addHit(L,n,at(o+s),H.tom[[220,165,120][j%3]],j===def.fill.length-1?1:.9));
    for(const s of def.wood) addHit(L,n,at(o+s),H.wood,.6);
    addHit(L,n,at(o),H.crash,bi===0?.8:.45);
    for(let t=0;t<def.steps;t++){
      if(def.open.includes(t)) addHit(L,n,at(o+t),H.hatO,.7);
      else addHit(L,n,at(o+t),H.hatC,def.starts.includes(t)?.85:(t%2===0?.5:.28));
    }
  });
  let pk=0;
  for(let i=0;i<n;i++){ const v=Math.tanh(2.4*L[i]); L[i]=v; const a=v<0?-v:v; if(a>pk) pk=a; }
  const g=.9/pk;
  for(let i=0;i<n;i++){ L[i]*=g; R[i]=L[i]; }
  return b;
}

function makeUwamonoBuffer(spec=activeSpec(), bpm=BPM){
  const sr=ctx.sampleRate, dur=loopDurOf(spec,bpm), n=Math.floor(sr*dur), TAU=Math.PI*2;
  const b=ctx.createBuffer(1,n,sr), d=b.getChannelData(0);
  // パッド：ループ内でちょうど整数周期になる周波数にそろえ（つなぎ目でプチッとならない）、
  // 1サンプルごとに sin を呼ばず漸化式で作る
  const q=f=>Math.round(f*dur)/dur;
  for(const f0 of spec.pad.map(q)) for(let k=1;k<=3;k++){
    const w=TAU*f0*k/sr, c=2*Math.cos(w), amp=1/k;
    let y1=0, y0=-Math.sin(w);
    for(let i=0;i<n;i++){ d[i]+=amp*y1; const y2=c*y1-y0; y0=y1; y1=y2; }
  }
  for(let i=0;i<n;i++) d[i]*=(1+.2*Math.sin(TAU*4*i/n))*.05;
  const step=n/totalStepsOf(spec), at=(s)=>Math.floor(s*step);
  barOffsetsOf(spec).forEach(({def,o})=>{
    for(let t=0;t<def.steps;t++) addHit(d,n,at(o+t),getNote(def.hi[t],18,6,.22),def.starts.includes(t)?.3:.2);
    def.starts.forEach((t,j)=>addHit(d,n,at(o+t),getNote(def.low[j],6,3,.4),.35));
  });
  let pk=0; for(let i=0;i<n;i++){ const a=d[i]<0?-d[i]:d[i]; if(a>pk) pk=a; }
  const g=.9/pk; for(let i=0;i<n;i++) d[i]*=g;
  return b;
}

function makeReversedBuffer(b){
  const r=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
  for(let ch=0;ch<b.numberOfChannels;ch++){
    const s=b.getChannelData(ch), d=r.getChannelData(ch), n=s.length;
    for(let i=0;i<n;i++) d[i]=s[n-1-i];
  }
  return r;
}

function angleOf(e){
  const r=platter.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));
}
function normDelta(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function updateVisual(){
  marker.style.transform=`rotate(${angle}rad)`;
}
// v33: カーソル(マーカー)をホーム（真上）へ戻す。何周回っていても最短回りで約0.16秒
let homeRaf=0;
function resetTtParams(){                 // v34: ホームに戻ったら、リピート／スタッターの値も初期値へ
  state.repeatIdx=REPEAT_HOME_IDX;
  state.stutterIdx=STUTTER_HOME_IDX;
  state.encAcc=0;
}
function cancelHome(){ if(homeRaf){ cancelAnimationFrame(homeRaf); homeRaf=0; } }
function returnMarkerHome(){
  cancelHome();
  angle=normDelta(angle);
  const from=angle, start=performance.now(), dur=160;
  const stepFn=(now)=>{
    const k=Math.min(1,(now-start)/dur), e=1-Math.pow(1-k,3);
    angle=from*(1-e);
    updateVisual();
    if(k<1) homeRaf=requestAnimationFrame(stepFn);
    else { homeRaf=0; angle=0; updateVisual(); }
  };
  homeRaf=requestAnimationFrame(stepFn);
}

function currentPhase(){
  if(!scratchBuf)return 0;
  const D=scratchBuf.duration;
  const elapsedScaled=(ctx.currentTime-t0)*tempoRatio();
  return (((elapsedScaled%D)+D)%D)/D;
}
function setPhaseAnchor(phase){
  if(!ctx||!scratchBuf)return;
  const p=((phase%1)+1)%1;
  const D=scratchBuf.duration;
  const r=Math.max(0.1,tempoRatio());
  t0=ctx.currentTime-(p*D)/r;
  syncTime();
}

let beatSrc=null, beatSrcGain=null, beatOld=null;   // beatOld: 切り替え予約で「終わらせる予定」の古い方
function endVoice(v,at){
  if(!v)return;
  const gp=v.gain.gain;                 // v.gain は GainNode。音量そのものは .gain
  gp.cancelScheduledValues(at);
  gp.setTargetAtTime(0,at,0.006);
  try{v.src.stop(at+0.05)}catch{}
}
function stopBeatSrc(){
  const t=ctx.currentTime;
  if(beatSrc){ endVoice({src:beatSrc,gain:beatSrcGain},t); beatSrc=null; beatSrcGain=null; }
  if(beatOld){ endVoice(beatOld,t); beatOld=null; }
}
// replaceAt を指定すると、古いビートをその時刻で終わらせて、新しいビートを when に始める（予約）
function scheduleBeat(when=ctx.currentTime, phase=0, fadeIn=false, replaceAt=null, buf=beatBuf){
  if(replaceAt===null) stopBeatSrc();
  else{
    if(beatOld) endVoice(beatOld,ctx.currentTime);
    beatOld=beatSrc?{src:beatSrc,gain:beatSrcGain}:null;
    endVoice(beatOld,replaceAt);
  }
  const src=ctx.createBufferSource();
  src.buffer=buf; src.loop=true;
  src.playbackRate.value=state.screwActive?Math.max(0.08,tempoRatio()*state.screwRate):tempoRatio();
  const g=ctx.createGain();
  if(fadeIn){ g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(1,when+0.01); }
  else g.gain.value=1;
  src.connect(g); g.connect(beatGain);
  const offset=Math.max(0,Math.min(buf.duration-0.001,phase*buf.duration));
  src.start(when,offset);
  beatSrc=src; beatSrcGain=g;
}

const UWA_LEVEL=.45, REV_SEC=1.8;
let uwaSrc=null, uwaGain=null, uwaOld=null;
function stopUwaNormal(){
  const t=ctx.currentTime;
  if(uwaSrc){ endVoice({src:uwaSrc,gain:uwaGain},t); uwaSrc=null; uwaGain=null; }
  if(uwaOld){ endVoice(uwaOld,t); uwaOld=null; }
}
function startUwaNormal(when,phase,fadeIn,replaceAt=null,buf=scratchBuf){
  if(replaceAt===null) stopUwaNormal();
  else{
    if(uwaOld) endVoice(uwaOld,ctx.currentTime);
    uwaOld=uwaSrc?{src:uwaSrc,gain:uwaGain}:null;
    endVoice(uwaOld,replaceAt);
  }
  const s2=ctx.createBufferSource();
  s2.buffer=buf; s2.loop=true; s2.loopStart=0; s2.loopEnd=buf.duration;
  s2.playbackRate.value=state.screwActive?Math.max(0.08,tempoRatio()*state.screwRate):tempoRatio();
  const g=ctx.createGain();
  const targetLevel = activeMomMode==='repeat' ? 0.01 : UWA_LEVEL;
  if(fadeIn){ g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(targetLevel,when+0.01); }
  else g.gain.value=targetLevel;
  s2.connect(g); g.connect(scratchGain);
  const offset=Math.max(0,Math.min(buf.duration-0.001,phase*buf.duration));
  s2.start(when,offset);
  uwaSrc=s2; uwaGain=g;
}

let scrSrc=null, scrGain=null, scrDir=0;
function scrStop(){
  if(!scrSrc)return;
  const sA=scrSrc, gA=scrGain;
  scrSrc=null; scrGain=null; scrDir=0;
  const t=ctx.currentTime;
  gA.gain.cancelScheduledValues(t);
  gA.gain.setTargetAtTime(0,t,0.008);
  try{sA.stop(t+0.06)}catch{}
}
function scrStart(direction){
  scrStop();
  const D=scratchBuf.duration;
  const s2=ctx.createBufferSource();
  s2.buffer=direction<0?scratchRevBuf:scratchBuf;
  s2.loop=true; s2.loopStart=0; s2.loopEnd=D;
  s2.playbackRate.value=0.001;
  const g=ctx.createGain(); g.gain.value=0;
  s2.connect(g); g.connect(scratchGain);
  const off=direction<0?(D-scratchPos):scratchPos;
  s2.start(0,Math.max(0,Math.min(D-0.001,off)));
  scrSrc=s2; scrGain=g; scrDir=direction;
}
function scrFollow(rate){
  if(!scrSrc)return;
  const t=ctx.currentTime;
  scrSrc.playbackRate.setTargetAtTime(Math.max(0.001,rate),t,0.012);
  scrGain.gain.setTargetAtTime(rate>0.03?UWA_LEVEL:0,t,0.012);
}

function exitScratchMode(){
  if(!scratchingActive)return;
  scratchingActive=false;
  scrStop();
  state.scrNorm=0;
  state.scrSpeedText='0.00';
  if(playing && !uwaSrc){
    startUwaNormal(ctx.currentTime,currentPhase(),true);
  }
  if(rebuildDeferred){ rebuildDeferred=false; queueRebuild(); }
}

let scratchPos=0, lastLoopPhase=0;

function audioLoop(){
  if(!ctx||!playing)return;
  const phase=currentPhase();
  phaseEl.textContent=phase.toFixed(2);
  if(pendingSwitch && ctx.currentTime>=pendingSwitch.at) finishPatternSwitch();
  lastLoopPhase=phase;
  if(dragging && scratchingActive && scrSrc && performance.now()-lastT>45){
    velocity=0;
    scrFollow(0);
    state.scrNorm=0;
    state.scrSpeedText='0.00';
    updateMonitors();
  }
  requestAnimationFrame(audioLoop);
}

function beginScratch(e){
  if(!ctx||!playing)return;
  e.preventDefault();
  platter.setPointerCapture?.(e.pointerId);
  cancelHome();
  state.encAcc=0;
  dragging=true;
  lastPointerAngle=angleOf(e);
  if(!state.ttHoldEnabled || !state.ttLatched){
    ttDeltaAngle=0;
  }
  if(state.ttHoldEnabled){
    state.ttLatched=true;
  }
  lastT=performance.now();
  velocity=0;
  dir=1;

  if(ttSel.scr){
    scratchingActive=true;
    scratchPos=currentPhase()*scratchBuf.duration;
    stopUwaNormal();
    scrDir=0;
    state.scrSpeedText='0.00';
  }
  evaluateEffects();
}

function moveScratch(e){
  if(!dragging||!ctx||!playing)return;
  e.preventDefault();
  const a=angleOf(e);
  let da=normDelta(a-lastPointerAngle);
  const now=performance.now(), dt=Math.max(1,now-lastT)/1000;
  const inst=da/dt/(Math.PI*2);
  velocity=velocity*.45+inst*.55;
  if(velocity>0.05 && dir<0) dir=1;
  else if(velocity<-0.05 && dir>0) dir=-1;

  angle += da;
  ttDeltaAngle += da;
  if(ttSel.repeat||ttSel.stutter) ttEncoder(da);
  lastPointerAngle=a; lastT=now;
  updateVisual();

  if(ttSel.scr){
    if(!scratchingActive){
      scratchingActive=true;
      scratchPos=currentPhase()*scratchBuf.duration;
      stopUwaNormal();
      scrDir=0;
    }
    scratchPos += da/(Math.PI*2)*REV_SEC;
    scratchPos=((scratchPos%scratchBuf.duration)+scratchBuf.duration)%scratchBuf.duration;
    const rate=Math.abs(velocity)*REV_SEC;
    state.scrNorm=Math.min(1, rate/3.0);
    state.scrSpeedText=rate.toFixed(2);
    if(dir!==scrDir) scrStart(dir);
    scrFollow(rate);
  }
  evaluateEffects();
}

function endScratch(e){
  if(!dragging)return;
  e?.preventDefault();
  dragging=false;
  if(!state.ttHoldEnabled){
    state.ttLatched=false;
    ttDeltaAngle=0;
    resetTtParams();         // v34: 値も初期値へ
    returnMarkerHome();      // v33: HOLDしていなければ離したらホームへ
  }
  if(scratchingActive){
    exitScratchMode();
  }
  velocity=0;
  evaluateEffects();
}

// ----- パターン／BPMごとの音源をキャッシュ。使わないパターンも空き時間に先に作っておく -----
const patCache=new Map();
function getPatBuffers(patKey,bpm){
  const key=patKey+'@'+bpm;
  let e=patCache.get(key);
  if(!e){
    const spec=PATTERNS[patKey];
    const beat=makeBeatBuffer(spec,bpm), uwa=makeUwamonoBuffer(spec,bpm);
    e={beat,uwa,rev:makeReversedBuffer(uwa)};
    patCache.set(key,e);
  }
  return e;
}
function useBuffers(e){ beatBuf=e.beat; scratchBuf=e.uwa; scratchRevBuf=e.rev; }
let prewarmTimer=null;
function prewarmPatterns(){
  clearTimeout(prewarmTimer);
  if(!ctx)return;
  const todo=Object.keys(PATTERNS).filter(p=>!patCache.has(p+'@'+bufferBPM));
  if(!todo.length)return;
  prewarmTimer=setTimeout(()=>{
    if(dragging||scratchingActive){ prewarmPatterns(); return; }    // 操作中は待つ
    getPatBuffers(todo[0],bufferBPM);
    prewarmPatterns();
  },120);
}
function refreshMomentary(){ if(activeMomMode){ activeMomDiv=0; evaluateEffects(); } }

// ----- NEXT（ループの頭で切替）：オーディオ時計で予約する -----
let pendingSwitch=null;   // {pat, at, entry}
function schedulePatternSwitch(patKey){
  const e=getPatBuffers(patKey,BPM);                    // 先に用意（キャッシュ済みなら即）
  if(Math.abs(e.uwa.duration-scratchBuf.duration)>0.001){ applyPatternImmediate(patKey,currentPhase()); return; }
  const D=scratchBuf.duration, now=ctx.currentTime;
  const at=t0+Math.ceil((now+0.03-t0)/D)*D;             // 次のループの頭
  pendingSwitch={pat:patKey,at,entry:e};
  queuedPat=patKey;
  scheduleBeat(at,0,true,at,e.beat);
  if(!scratchingActive) startUwaNormal(at,0,true,at,e.uwa);
  renderPatternUI();
  statusEl.textContent=`QUEUED PAT ${patKey}`;
}
function finishPatternSwitch(){
  const p=pendingSwitch; pendingSwitch=null; queuedPat=null;
  currentPat=p.pat; useBuffers(p.entry);
  beatOld=null; uwaOld=null;
  if(!scratchingActive && !uwaSrc) startUwaNormal(ctx.currentTime,currentPhase(),true);
  lastLoopPhase=currentPhase();
  refreshMomentary();
  renderPatternUI();
  statusEl.textContent=`PLAY [PAT ${currentPat}] BPM ${BPM}`;
  syncTime();
}
function cancelPendingSwitch(){          // 予約を取り消し、いまのパターンをタイムライン位置から流し直す
  if(!pendingSwitch)return;
  pendingSwitch=null; queuedPat=null;
  if(ctx&&playing){
    const now=ctx.currentTime, p=currentPhase();
    scheduleBeat(now,p,true);
    if(!scratchingActive) startUwaNormal(now,p,true);
  }
  renderPatternUI();
}
// 音を入れ直す処理(fn)のあいだ、切替の予約を一度外して、あとで取り直す
function withPendingKept(fn){
  const pend=pendingSwitch?pendingSwitch.pat:null;
  pendingSwitch=null;
  fn();
  if(pend && playing && ctx) schedulePatternSwitch(pend);
}

function applyPatternImmediate(patKey, keepPhase=null){
  if(!PATTERNS[patKey])return;
  pendingSwitch=null; queuedPat=null;
  currentPat=patKey;
  renderPatternUI();
  if(!ctx)return;
  const f=keepPhase!==null ? keepPhase : currentPhase();
  useBuffers(getPatBuffers(patKey,BPM));
  if(playing){
    const now=ctx.currentTime;
    setPhaseAnchor(f);
    lastLoopPhase=f;
    scheduleBeat(now,f,true);
    if(!scratchingActive) startUwaNormal(now,f,true);
    refreshMomentary();
    statusEl.textContent=`PLAY [PAT ${currentPat}] BPM ${BPM}`;
  }
}

function selectPattern(patKey){
  if(!PATTERNS[patKey])return;
  if(patKey===currentPat){ if(pendingSwitch) cancelPendingSwitch(); return; }
  if(pendingSwitch && pendingSwitch.pat===patKey) return;
  if(switchAtLoopEnd && playing && ctx){
    if(pendingSwitch) cancelPendingSwitch();
    schedulePatternSwitch(patKey);
  }else{
    applyPatternImmediate(patKey, playing && ctx ? currentPhase() : 0);
  }
}

// ----- BPM変更 -----
// v35: 音程を変えずに作り直して入れ替える（ループ内の位置の割合を保つので拍は途切れない）。
// スライダー操作中は最大150msごとに最新の値で作り直す。円盤でスクラッチ中は離してから反映する。
let targetBPM=140, rebuildTimer=null, rebuildDeferred=false;
function queueRebuild(){
  if(rebuildTimer)return;
  rebuildTimer=setTimeout(()=>{ rebuildTimer=null; rebuildBuffersAtCurrentBPM(); },150);
}
function rebuildBuffersAtCurrentBPM(){
  if(!ctx || targetBPM===BPM)return;
  if(scratchingActive){ rebuildDeferred=true; return; }
  const f=playing ? currentPhase() : 0;             // 古いBPM基準の「いまの位置」
  BPM=targetBPM; bufferBPM=BPM;
  for(const k of [...patCache.keys()]) if(!k.endsWith('@'+BPM)) patCache.delete(k);
  useBuffers(getPatBuffers(currentPat,BPM));
  if(playing){
    withPendingKept(()=>{
      const now=ctx.currentTime;
      setPhaseAnchor(f);
      lastLoopPhase=f;
      scheduleBeat(now,f,true);
      if(!scratchingActive) startUwaNormal(now,f,true);
      refreshMomentary();
    });
    statusEl.textContent=`PLAY [PAT ${currentPat}] BPM ${BPM}`;
  }
  prewarmPatterns();
  if(targetBPM!==BPM) queueRebuild();               // 作っている間にさらに動かされていたら続けて
}

function setBPM(v){
  v=Math.max(80,Math.min(180,Math.round(v)));
  targetBPM=v;
  bpmEl.textContent=v;
  bpmSlider.value=String(v);
  if(!ctx){ BPM=v; bufferBPM=v; return; }
  if(v!==BPM) queueRebuild();
}

// ===== v36: ブラウン管モニター =====
// 各コントローラーの上に1台ずつ。「最後に選んだエフェクト」のパラメーターを、実際の音の値で描く。
// 描画は指のイベントとは切り離し、30fpsで別に回す（スマホで重くならないように）。
const monView={};
function topSel(order,sel){ for(let i=order.length-1;i>=0;i--) if(sel[order[i]]) return order[i]; return null; }

const CRT_FPS=60, MONO='ui-monospace,Menlo,Consolas,monospace';
const crts=[];
function makeCrt(id,theme,draw){
  const el=document.getElementById(id), canvas=el.querySelector('canvas');
  const c={el,canvas,g:canvas.getContext('2d'),W:300,H:225,theme,draw,ph:0};
  crts.push(c); return c;
}
function resizeCrt(c){
  const r=c.el.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  c.W=Math.max(40,Math.round(r.width)); c.H=Math.max(30,Math.round(r.height));
  c.canvas.width=Math.round(c.W*dpr); c.canvas.height=Math.round(c.H*dpr);
  c.g.setTransform(dpr,0,0,dpr,0,0);
  c.g.fillStyle='#000'; c.g.fillRect(0,0,c.W,c.H);
  c.freqN=Math.min(180,c.W);                        // 周波数軸の点の数
  c.logF=new Float32Array(c.freqN); c.linF=new Float32Array(c.freqN);
  for(let i=0;i<c.freqN;i++){
    c.logF[i]=30*Math.pow(18000/30,i/(c.freqN-1));  // 対数軸 30Hz〜18kHz
    c.linF[i]=i/(c.freqN-1)*4500+20;                // 直線軸 0〜4.5kHz
  }
  c.mag=new Float32Array(c.freqN); c.phs=new Float32Array(c.freqN);
}

// 解析データは1フレームに1回だけ読む（両方のモニターで共有）
let specBuf=null, timeBuf=null;
function readAudioForCrt(){
  if(!ctx||!analyser) return false;
  if(!specBuf){ specBuf=new Uint8Array(analyser.frequencyBinCount); timeBuf=new Uint8Array(analyser.fftSize); }
  analyser.getByteFrequencyData(specBuf);
  analyser.getByteTimeDomainData(timeBuf);
  return true;
}
function specAt(f){                                   // 周波数 f のスペクトル(0〜1)
  const bins=specBuf.length, x=f/(ctx.sampleRate/2)*bins, i=Math.min(bins-2,Math.floor(x)), t=x-i;
  return (specBuf[i]*(1-t)+specBuf[i+1]*t)/255;
}

function fade(c,a){ c.g.fillStyle=`rgba(0,0,0,${a})`; c.g.fillRect(0,0,c.W,c.H); }   // 残光（前のフレームが薄く残る）
function glowStroke(g,color,w,path){
  g.lineJoin='round'; g.lineCap='round'; g.strokeStyle=color;
  g.globalAlpha=.18; g.lineWidth=w*5; path(); g.stroke();
  g.globalAlpha=.45; g.lineWidth=w*2.4; path(); g.stroke();
  g.globalAlpha=1; g.lineWidth=w; path(); g.stroke();
}
function hud(c,left,right,dim){
  const g=c.g; g.font=`700 10px ${MONO}`; g.textBaseline='top';
  g.fillStyle=c.theme.main; g.globalAlpha=dim?.55:1;
  g.textAlign='left'; g.fillText(left,8,6);
  g.textAlign='right'; g.fillText(right,c.W-8,6);
  g.globalAlpha=1;
}
function standbyText(c,t,msg){
  if(Math.floor(t*2)%2) return;
  const g=c.g; g.font=`700 11px ${MONO}`; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle=c.theme.main; g.fillText(msg,c.W/2,c.H-12);
}

// 何も選ばれていないとき・音が出ていないとき：砂嵐
let noiseCv=null, noiseG=null, noiseImg=null;
function drawNoise(c,t,msg1,msg2){
  if(!noiseCv){ noiseCv=document.createElement('canvas'); noiseCv.width=64; noiseCv.height=48; noiseG=noiseCv.getContext('2d'); noiseImg=noiseG.createImageData(64,48); }
  const d=noiseImg.data;
  for(let i=0;i<d.length;i+=4){ const v=Math.random()*90|0; d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255; }
  noiseG.putImageData(noiseImg,0,0);
  const g=c.g; g.imageSmoothingEnabled=false; g.drawImage(noiseCv,0,0,c.W,c.H);
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,c.H/2-22,c.W,44);
  g.font=`700 12px ${MONO}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=c.theme.main;
  g.fillText(msg1,c.W/2,c.H/2-7); g.globalAlpha=.7; g.font=`10px ${MONO}`; g.fillText(msg2,c.W/2,c.H/2+10); g.globalAlpha=1;
}

// ---- フィルター／フランジャー：実際の周波数特性で、スペクトルが削れる ----
// axis: 'log'|'lin'、mag: 各周波数での利得(リニア)
function drawCarve(c,t,axis,mag,opts){
  const g=c.g, W=c.W, H=c.H, N=c.freqN, F=axis==='log'?c.logF:c.linF;
  const top=24, bot=H-8, plotH=bot-top;
  if(!opts.noTrail) fade(c,.32); else { g.fillStyle='#000'; g.fillRect(0,0,W,H); }   // 残光なしのときは毎フレーム消す（前の絵が重なって崩れていた）
  g.globalAlpha=.16; g.strokeStyle=c.theme.main; g.lineWidth=1;       // 目盛り
  g.beginPath();
  if(axis==='log'){ for(const f of [100,1000,10000]){ const x=Math.log(f/30)/Math.log(18000/30)*W; g.moveTo(x,top); g.lineTo(x,bot); } }
  else { for(const f of [1000,2000,3000,4000]){ const x=f/4500*W; g.moveTo(x,top); g.lineTo(x,bot); } }
  g.moveTo(0,bot); g.lineTo(W,bot); g.stroke(); g.globalAlpha=1;
  const hasAudio=!!specBuf;
  const sp=(f,i)=>hasAudio?specAt(f):(.55+.35*Math.sin(i*.21+t*2));
  const colW=Math.max(1.5,W/N);
  // v37: 共振で持ち上がった分もはみ出さず見えるよう、スペクトルの基準の高さを少し低くする
  const K=.62;
  for(let i=0;i<N;i++){
    const x=i/(N-1)*W, v=sp(F[i],i)*K, m=Math.min(3,mag[i]), vc=Math.min(1,v*m);
    g.fillStyle=c.theme.main;
    g.globalAlpha=.14*(opts.dim?.6:1); g.fillRect(x-colW/2,bot-v*plotH,colW,v*plotH);
    g.globalAlpha=(opts.dim?.45:.85); g.fillRect(x-colW/2,bot-vc*plotH,colW,Math.max(0,vc*plotH));
  }
  g.globalAlpha=1;
  // フィルターの曲線。0dBより上（共振）は expo 倍に強調して高さを出す
  const dbMin=opts.dbMin??-48, dbMax=opts.dbMax??16, expo=opts.expo??1;
  const yOfDb=(db)=>{ const e=db>0?db*expo:db; return bot-Math.max(0,Math.min(1,(e-dbMin)/(dbMax-dbMin)))*plotH; };
  const yOf=(m)=>yOfDb(20*Math.log10(Math.max(1e-3,m)));
  const y0=yOfDb(0);
  if(opts.reso){                                                        // 共振の山を塗りつぶして光らせる
    g.fillStyle=c.theme.core;
    for(let i=0;i<N;i++){
      if(mag[i]<=1.02) continue;
      const x=i/(N-1)*W, y=yOf(mag[i]);
      g.globalAlpha=(opts.dim?.25:.6); g.fillRect(x-colW/2,y,colW,y0-y);
    }
    g.globalAlpha=1;
  }
  glowStroke(g,opts.dim?c.theme.dim:c.theme.core,1.6,()=>{ g.beginPath(); for(let i=0;i<N;i++){ const x=i/(N-1)*W,y=yOf(mag[i]); i?g.lineTo(x,y):g.moveTo(x,y); } });
  if(opts.cut){                                                         // カットオフの位置
    const x=axis==='lin'?opts.cut/4500*W:Math.log(opts.cut/30)/Math.log(18000/30)*W;
    g.strokeStyle=c.theme.core; g.globalAlpha=.7; g.setLineDash([3,3]); g.beginPath(); g.moveTo(x,top); g.lineTo(x,bot); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
  }
  if(opts.reso){                                                        // ピークに脈打つリングと「RESO +○dB」
    let pi=0; for(let i=1;i<N;i++) if(mag[i]>mag[pi]) pi=i;
    const pdb=20*Math.log10(Math.max(1e-3,mag[pi]));
    if(pdb>1.5 && !opts.dim){
      const px=pi/(N-1)*W, py=yOf(mag[pi]), r=3+pdb*.75+Math.sin(t*9)*1.1;
      g.strokeStyle=c.theme.core; g.lineWidth=1.5; g.globalAlpha=.9;
      g.beginPath(); g.arc(px,py,r,0,Math.PI*2); g.stroke();
      const ph=(t*1.6)%1; g.globalAlpha=(1-ph)*.7; g.lineWidth=1;
      g.beginPath(); g.arc(px,py,r+ph*16,0,Math.PI*2); g.stroke(); g.globalAlpha=1;
      const txt=`RESO +${pdb.toFixed(1)}dB`;
      g.font=`700 12px ${MONO}`; g.textBaseline='middle';
      const tw=g.measureText(txt).width, gap=r+14;
      const rightFits=px+gap+tw+6<=W, leftFits=px-gap-tw-6>=0;
      let lx,ly=Math.max(top+12,Math.min(bot-10,py+2)), right;
      if(rightFits&&(px<W*.55||!leftFits)){ right=true; lx=px+gap; }          // 入る側に書く（右優先／左半分なら右）
      else if(leftFits){ right=false; lx=px-gap; }
      else { right=false; lx=Math.min(W-6,Math.max(tw+6,px+tw/2)); ly=Math.min(bot-10,py+r+14); }   // どちらも入らなければピークの下
      g.textAlign=right?'left':'right';
      g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(right?lx-4:lx-tw-4,ly-9,tw+8,18);
      g.fillStyle=c.theme.core; g.fillText(txt,lx,ly);
    }
  }
}

function drawLiveWave(c,t,active){
  if(!timeBuf) return;
  const g=c.g,W=c.W,H=c.H,mid=H*.60,amp=H*.22;
  g.save();
  g.globalAlpha=active?.72:.25;
  g.strokeStyle=active?c.theme.core:c.theme.main;
  g.lineWidth=active?1.4:1;
  g.beginPath();
  for(let x=0;x<W;x++){
    const idx=Math.floor(x/W*(timeBuf.length-1));
    const v=(timeBuf[idx]-128)/128;
    const y=mid-v*amp;
    x?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
  g.restore();
}

function filterVisualMag(type,fc,Q,f,Fs){
  // 表示専用の2次フィルター特性。fc=カットオフ、f=いま評価する周波数（画面の横位置ごとに変える）
  Q=Math.max(.5,Math.min(4.2,Q));      // Q(リニア)。実際のフィルターのQ(dB)を変換して渡す
  const w0=2*Math.PI*Math.min(fc,Fs*.49)/Fs, cw=Math.cos(w0), sw=Math.sin(w0), al=sw/(2*Q);
  let b0,b1,b2;
  if(type==='lpf'){ b0=(1-cw)/2; b1=1-cw; b2=b0; } else { b0=(1+cw)/2; b1=-(1+cw); b2=b0; }
  const a0=1+al, a1=-2*cw, a2=1-al;
  const w=2*Math.PI*f/Fs, c1=Math.cos(w), s1=Math.sin(w), c2=Math.cos(2*w), s2=Math.sin(2*w);
  const nr=b0+b1*c1+b2*c2, ni=-(b1*s1+b2*s2), dr=a0+a1*c1+a2*c2, di=-(a1*s1+a2*s2);
  return Math.hypot(nr,ni)/Math.max(1e-6,Math.hypot(dr,di));
}

function drawXyCrt(c,t,dt){
  const g=c.g, k=topSel(xyOrder,xySel);
  c.el.classList.toggle('live', !!k && state.xyHolding);
  const hasAudio=readAudioForCrt();
  if(!ctx){ g.fillStyle='#000'; g.fillRect(0,0,c.W,c.H); drawNoise(c,t,'XY MONITOR','PRESS START'); return; }
  if(!k){ g.fillStyle='#000'; g.fillRect(0,0,c.W,c.H); drawNoise(c,t,'XY MONITOR','SELECT FX  LPF HPF BIT FLG'); return; }
  const on=state.xyHolding;
  if(k==='lpf'||k==='hpf'){
    // フィルター表示は実際のWebAudio Qをそのまま描かず、視認性のための表示Qに制限。
    const freq=k==='lpf'?state.lpfFreq:state.hpfFreq;
    const visualQ=k==='lpf'?state.lpfQ:state.hpfQ;
    for(let i=0;i<c.freqN;i++) c.mag[i]=filterVisualMag(k,freq,Math.pow(10,visualQ/20),c.logF[i],ctx.sampleRate);
    drawCarve(c,t,'log',c.mag,{dim:!on,cut:on?freq:0,expo:1.7,dbMin:-48,dbMax:21,reso:true,noTrail:true});
    drawLiveWave(c,t,on);
    hud(c,k.toUpperCase()+' FILTER',
      k==='lpf' ? (on?`${freq>=1000?(freq/1000).toFixed(1)+'k':Math.round(freq)+'Hz'} Q${visualQ.toFixed(1)}`:'HOLD STANDBY')
                : (on?`${Math.round(freq)}Hz Q${visualQ.toFixed(1)}`:'HOLD STANDBY'),!on);
  }else if(k==='flg'){
    const depth=on?state.flgDepth:0, rate=on?state.flgRate:.4;
    c.ph=(c.ph+rate*dt)%1;
    const tri=1-4*Math.abs(c.ph-.5);
    const tau=0.0045+tri*(0.0008+depth*0.004);
    const wet=on?Math.min(.95,.25+depth*.7):0, fb=on?.55+depth*.35:0;
    for(let i=0;i<c.freqN;i++){
      const th=2*Math.PI*c.linF[i]*tau, zr=Math.cos(th), zi=-Math.sin(th);
      const dr=1-fb*zr, di=-fb*zi, den=dr*dr+di*di;
      const hr=(zr*dr+zi*di)/den, hi=(zi*dr-zr*di)/den;
      c.mag[i]=Math.hypot(1+wet*hr, wet*hi);
    }
    drawCarve(c,t,'lin',c.mag,{dim:!on,dbMin:-20,dbMax:12});
    hud(c,'FLANGER',on?`${state.flgRate.toFixed(1)}Hz ${Math.round(state.flgDepth*100)}%`:'HOLD STANDBY',!on);
  }else if(k==='bit'){
    drawBitScene(c,t,on);
    c.g.fillStyle='rgba(0,0,0,.55)'; c.g.fillRect(0,0,c.W,20);
    hud(c,'BIT CRUSHER',on?`B${Math.round(state.bitX*100)} F${Math.round(state.bitY*100)}`:'HOLD STANDBY',!on);
  }
  if(!on) standbyText(c,t,'TOUCH PAD / HOLD');
}

// ---- ビットクラッシャー：画面そのものが荒くなる（ドット化＋色数減）、波形は実際のカーブで量子化 ----
let sceneCv=null, sceneG=null, tinyCv=null, tinyG=null;
const SW=96, SH=72;
// Y（折り返し）が大きいほど崩れる：走査線のよれ、RGBずれ、ブロックの入れ替わり、ノイズ、縦ロール、明滅
function glitchImage(d,tw,th,y,t){
  const src=new Uint8ClampedArray(d);
  const at=(x,r)=>(r*tw+(((x%tw)+tw)%tw))*4;
  const roll=y>.7?Math.floor(Math.pow((y-.7)/.3,2)*th*((t*2.3)%1)):0;     // 縦ロール（y>0.7）
  const split=Math.round(y*y*5);                                           // RGBずれ
  const tearP=Math.min(.85,Math.pow(y,1.2)*.75), tearMax=y*tw*.5;          // 行ごとのよれ
  for(let r=0;r<th;r++){
    const sr=(((r+roll)%th)+th)%th;
    const sh=Math.random()<tearP?Math.round((Math.random()-.5)*2*tearMax):0;
    for(let x=0;x<tw;x++){
      const o=(r*tw+x)*4;
      d[o]=src[at(x+sh+split,sr)]; d[o+1]=src[at(x+sh,sr)+1]; d[o+2]=src[at(x+sh-split,sr)+2];
    }
  }
  const nb=Math.round(Math.pow(y,1.8)*10);                                 // ブロックの入れ替わり
  for(let k=0;k<nb;k++){
    const bw=4+Math.floor(Math.random()*Math.max(4,tw*.35)), bh=1+Math.floor(Math.random()*Math.max(2,th*.14));
    const sx=Math.floor(Math.random()*(tw-bw)), sy=Math.floor(Math.random()*(th-bh)), dx=Math.floor(Math.random()*(tw-bw)), dy=Math.floor(Math.random()*(th-bh));
    for(let yy=0;yy<bh;yy++) for(let xx=0;xx<bw;xx++){ const a=((sy+yy)*tw+sx+xx)*4, b=((dy+yy)*tw+dx+xx)*4; d[b]=d[a]; d[b+1]=d[a+1]; d[b+2]=d[a+2]; }
  }
  const flick=1+(Math.random()-.5)*y*.8, inv=y>.9&&Math.random()<.12, nz=Math.pow(y,2)*.14;   // 明滅・反転・ノイズ
  for(let i=0;i<d.length;i+=4){
    if(Math.random()<nz){ const v=Math.random()*255; d[i]=v; d[i+1]=Math.random()*255; d[i+2]=v; continue; }
    for(let k=0;k<3;k++){ let v=d[i+k]*flick; if(inv) v=255-v; d[i+k]=v; }
  }
}
function drawBitScene(c,t,on){
  if(!sceneCv){
    sceneCv=document.createElement('canvas'); sceneCv.width=SW; sceneCv.height=SH; sceneG=sceneCv.getContext('2d');
    tinyCv=document.createElement('canvas'); tinyCv.width=SW; tinyCv.height=SH; tinyG=tinyCv.getContext('2d');
  }
  const x=on?state.bitX:0, y=on?state.bitY:0, s=sceneG;
  // 画：夕焼けの太陽とグリッドの床＋波形
  const sky=s.createLinearGradient(0,0,0,SH*.62); sky.addColorStop(0,'#2a0b57'); sky.addColorStop(.55,'#c2308f'); sky.addColorStop(1,'#ffb347');
  s.fillStyle=sky; s.fillRect(0,0,SW,SH*.62);
  s.fillStyle='#ffe28a'; s.beginPath(); s.arc(SW/2,SH*.42,SH*.24,0,Math.PI*2); s.fill();
  s.fillStyle='#c2308f'; for(let i=0;i<5;i++){ const yy=SH*.42+i*SH*.045; s.fillRect(SW/2-SH*.26,yy,SH*.52,1+i*.5); }
  s.fillStyle='#12062b'; s.fillRect(0,SH*.62,SW,SH*.38);
  s.strokeStyle='#37e6ff'; s.lineWidth=1; s.beginPath();
  for(let i=-6;i<=6;i++){ s.moveTo(SW/2+i*2,SH*.62); s.lineTo(SW/2+i*13,SH); }
  const sc=(t*14)%1;
  for(let j=0;j<7;j++){ const f=(j+sc)/7, yy=SH*.62+SH*.38*f*f; s.moveTo(0,yy); s.lineTo(SW,yy); }
  s.stroke();
  // 波形（エフェクト前の音を、実際のビットクラッシャーのカーブに通す）
  const curve=bitNode&&bitNode.curve, n=curve?curve.length:0;
  s.strokeStyle='#ffffff'; s.lineWidth=1.4; s.beginPath();
  for(let i=0;i<SW;i++){
    let v=timeBuf?((timeBuf[Math.floor(i/SW*512)]-128)/128*2.4):Math.sin(i*.3+t*5)*.6;
    v=Math.max(-1,Math.min(1,v));
    if(n) v=curve[Math.round((v+1)/2*(n-1))];                          // 実際のカーブに通す
    const yy=SH*.5-v*SH*.34; i?s.lineTo(i,yy):s.moveTo(i,yy);
  }
  s.stroke();
  // 荒さ：ドットの大きさと色数
  const p=1+Math.floor(Math.pow(x,1.6)*6);                              // 1〜7ドット
  const levels=Math.max(3,Math.round(32*Math.pow(1-x,2.6)+2));          // 実際のビットクラッシャーの段数と同じ式（見やすいよう最小3段）
  const tw=Math.max(2,Math.ceil(SW/p)), th=Math.max(2,Math.ceil(SH/p));
  tinyG.imageSmoothingEnabled=true; tinyG.clearRect(0,0,SW,SH); tinyG.drawImage(sceneCv,0,0,SW,SH,0,0,tw,th);
  const img=tinyG.getImageData(0,0,tw,th), d=img.data, L1=Math.min(255,levels)-1;
  if(levels<64) for(let i=0;i<d.length;i+=4){ d[i]=Math.round(d[i]/255*L1)/L1*255; d[i+1]=Math.round(d[i+1]/255*L1)/L1*255; d[i+2]=Math.round(d[i+2]/255*L1)/L1*255; }
  if(y>.04) glitchImage(d,tw,th,y,t);
  tinyG.putImageData(img,0,0);
  const g=c.g; g.imageSmoothingEnabled=false; g.globalAlpha=on?1:.55; g.drawImage(tinyCv,0,0,tw,th,0,0,c.W,c.H); g.globalAlpha=1;
  if(y>.85 && Math.floor(t*6)%2===0){                                    // 限界を超えたら警告
    g.fillStyle='rgba(0,0,0,.7)'; g.fillRect(0,c.H-26,c.W,22);
    g.font=`700 13px ${MONO}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#ff4a4a';
    g.fillText('FOLD OVERLOAD',c.W/2,c.H-15);
  }
}

// ---- ターンテーブル側モニター：ドットダンサー v2 ----
// ・踊りの周期を「2拍で1回」に（以前は1ループ=約4秒で1回しか動かなかった）。腕は頭の上まで、脚は大きく蹴る
// ・スクラッチ=掴んだ位置に合わせて前後に踊る／リピート=短い区間を踊り直す
// ・スタッター=コマ送り（フィルム枠・姿勢が飛ぶ・残像・明滅）／スクリュー=速さに応じて踊りが本当に遅く・速くなる
let danceAcc=0;
function dancePose(a,e){
  const s1=Math.sin(a), pos=Math.max(0,s1), neg=Math.max(0,-s1);
  return { lean:s1*.30*e, bob:Math.abs(Math.sin(a))*e, sway:s1*e*.9,
    shL:.25+2.4*pos*e, elL:.2+1.3*pos*e, shR:.25+2.4*neg*e, elR:.2+1.3*neg*e,
    hipL:.7*s1*e, knL:.15+1.2*pos*e, hipR:-.7*s1*e, knR:.15+1.2*neg*e };
}
function drawDancer(g,cx,cy,s,P,fill){
  g.save(); g.fillStyle=fill; g.shadowColor=fill; g.shadowBlur=s*.9;
  const blk=(x,y,w=1.25)=>g.fillRect(Math.round(x-w*s/2),Math.round(y-w*s/2),Math.max(1,Math.round(w*s)),Math.max(1,Math.round(w*s)));
  const bx=cx+P.sway*s*1.6, by=cy+s*3-P.bob*s*2.4;               // 腰
  const up=(L)=>[bx+Math.sin(P.lean)*L*s, by-Math.cos(P.lean)*L*s];
  const [sx,sy]=up(5.5), [hx,hy]=up(8.8);
  for(let i=0;i<=6;i++){ const t=i/6; blk(bx+(sx-bx)*t,by+(sy-by)*t,1.5); }   // 胴
  blk(hx,hy,3);                                                              // 頭
  const limb=(x0,y0,a1,l1,a2,l2)=>{                                          // 角度は真下=0、+で画面の右へ
    let x=x0,y=y0;
    for(let i=1;i<=3;i++){ x=x0+Math.sin(a1)*l1*s*i/3; y=y0+Math.cos(a1)*l1*s*i/3; blk(x,y); }
    for(let i=1;i<=3;i++) blk(x+Math.sin(a1+a2)*l2*s*i/3, y+Math.cos(a1+a2)*l2*s*i/3);
  };
  limb(sx-s*1.2,sy+s*.4,-P.shL,3.6,-P.elL*.7,3.4);                           // 左腕
  limb(sx+s*1.2,sy+s*.4, P.shR,3.6, P.elR*.7,3.4);                           // 右腕
  limb(bx-s*.8,by,P.hipL-.1,4,-P.knL,4);                                     // 左脚
  limb(bx+s*.8,by,P.hipR+.1,4, P.knR,4);                                     // 右脚
  g.restore();
}
function drawTtDancer(c,t,dt){
  const g=c.g,W=c.W,H=c.H,k=topSel(ttOrder,ttSel),mv=k?monView[k]:null,on=!!(mv&&mv.active),th=c.theme;
  c.el.classList.toggle('live',on);
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  if(!ctx||!scratchBuf){ drawNoise(c,t,'TT DANCER',!ctx?'PRESS START':'NO AUDIO'); return; }

  const D=scratchBuf.duration, beatSec=60/BPM, cycSec=beatSec*2;              // 2拍で1回踊る
  const beatPos=playing?currentPhase()*D:0, a0=beatPos/cycSec*Math.PI*2;
  const s=Math.max(3,Math.floor(Math.min(W,H)/30)), cx=W/2, cy=H*.50;
  let core=th.core, main=th.main, label='BEAT DANCE';

  if(k==='scr'&&on){                                                          // スクラッチ：掴んだ位置に合わせて前後に踊る
    const dirn=dir, mag=Math.min(1,Math.abs(velocity)/3);
    const a=(scratchingActive?scratchPos:beatPos)/cycSec*Math.PI*2;
    core='#ffffff'; main='#7df6ff';
    for(let i=6;i>=1;i--){ g.save(); g.globalAlpha=.06+(6-i)*.03; g.translate(-dirn*i*s*3.2*mag,0); drawDancer(g,cx,cy,s,dancePose(a-dirn*i*.12*mag,1),main); g.restore(); }
    drawDancer(g,cx,cy,s,dancePose(a,1.05),core);
    label=`SCRATCH ${dirn>0?'▶':'◀'} ${Math.abs(velocity).toFixed(1)}`;
  }else if(k==='repeat'&&on){                                                 // リピート：短い区間を何度も踊り直す
    const div=REPEAT_DIVS[state.repeatIdx]||1, span=D/div, local=(((beatPos%span)+span)%span)/span;
    const a=local*Math.PI*2*Math.max(1,Math.min(2,div/8));
    core='#ffd166'; main='#ff7a00';
    const bnd=Math.sin(local*Math.PI*2)*.5+.5;
    for(let i=3;i>=1;i--){ g.save(); g.globalAlpha=.08+i*.05; g.translate((i-2)*s*6*bnd,0); drawDancer(g,cx,cy,s,dancePose(a,.9),main); g.restore(); }
    if(Math.floor(local*4)%2===0){ g.fillStyle='rgba(255,150,40,.12)'; g.fillRect(0,0,W,H); }
    drawDancer(g,cx,cy,s,dancePose(a,1.05),core);
    label=`REPEAT 1/${div}`;
  }else if(k==='stutter'&&on){                                                // スタッター：コマ送り
    const div=STUTTER_DIVS[state.stutterIdx]||1, sl=beatSec*4/div;
    const stepHz=Math.min(10,Math.max(3,1/sl)), fr=Math.floor(t*stepHz), fph=(t*stepHz)%1;   // 目で追えるコマ数に丸める
    const poseOf=(f)=>(((f*3)%8)/8)*Math.PI*2;                                // 毎コマ大きく違う姿勢へ飛ぶ
    core='#ff7ae5'; main='#8b3dff';
    g.fillStyle='rgba(160,60,255,.10)'; g.fillRect(0,0,W,H);
    const perf=Math.max(9,s*2.4), off=(fr%2)*perf*.5;                          // フィルム枠：1コマごとにカクッと送られる
    g.fillStyle='rgba(255,122,229,.55)'; g.fillRect(0,0,W,s*1.6); g.fillRect(0,H-s*1.6-16,W,s*1.6);
    g.fillStyle='#000';
    for(let x=-perf+off;x<W+perf;x+=perf){ g.fillRect(x+perf*.2,s*.35,perf*.5,s*.9); g.fillRect(x+perf*.2,H-s*1.6-16+s*.35,perf*.5,s*.9); }
    for(let i=3;i>=1;i--){ g.save(); g.globalAlpha=.07+(3-i)*.06; g.translate(-i*s*3.6,0); drawDancer(g,cx,cy,s,dancePose(poseOf(fr-i),1.05),main); g.restore(); }   // 直前のコマの残像
    if(fph<.76||sl>.12) drawDancer(g,cx,cy,s,dancePose(poseOf(fr),1.1),core);   // 次のコマへ切り替わる直前は一瞬消える
    g.font=`700 11px ${MONO}`; g.textAlign='right'; g.textBaseline='top'; g.fillStyle=core; g.fillText('F'+String(fr%100).padStart(2,'0'),W-8,s*1.6+4);
    label=`STUTTER 1/${div}`;
  }else if(k==='screw'&&on){                                                  // スクリュー：踊りの速さそのものが遅く・速くなる
    const rate=state.screwRate||1, slow=rate<.97, fast=rate>1.03;
    danceAcc+=dt*rate*Math.PI*2/cycSec;
    core=slow?'#63d8ff':fast?'#fff06a':th.core; main=slow?'#2588a8':fast?'#d5b500':th.main;
    const sx=slow?1+(1-rate)*.9:fast?Math.max(.62,1-(rate-1)*.5):1, sy=slow?1-(1-rate)*.25:fast?1+(rate-1)*.18:1;
    g.save(); g.translate(0,s*2.2); g.translate(cx,cy+s*3); g.scale(sx,sy); g.translate(-cx,-(cy+s*3));
    if(slow){ for(let i=4;i>=1;i--){ g.save(); g.globalAlpha=.05+(4-i)*.03; g.translate(i*s*1.1*(1-rate),i*s*.5*(1-rate)); drawDancer(g,cx,cy,s,dancePose(danceAcc-i*.25*(1-rate),.8),main); g.restore(); } }
    if(fast){ g.fillStyle=main; for(let i=0;i<9;i++){ const yy=cy-s*8+((i*53+t*400*rate)%(s*20)), ll=s*(4+(rate-1)*8), xx=(W*.12+((i*97+t*900*rate)%(W*.76))); g.globalAlpha=.35; g.fillRect(xx,yy,ll,2); } g.globalAlpha=1; }
    drawDancer(g,cx,cy,s,dancePose(danceAcc,slow?.8:1.05),core);
    g.restore();
    // 速さメーター（中央=1.0x）と流れる矢印
    const mx=W*.12, mw=W*.76, my=H-s*5.4, p=(rate-.08)/1.77, one=(1-.08)/1.77;
    g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(mx,my,mw,5);
    g.fillStyle=main; g.fillRect(mx+mw*Math.min(p,one),my,mw*Math.abs(p-one),5);
    g.fillStyle='#fff'; g.fillRect(mx+mw*one-1,my-4,2,13); g.fillStyle=core; g.fillRect(mx+mw*p-2,my-5,4,15);
    g.font=`700 ${Math.round(s*2.2)}px ${MONO}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=core; g.globalAlpha=.65+.35*Math.sin(t*8);
    g.fillText(slow?'◀◀  SLOW':fast?'FAST  ▶▶':'1.00x',cx,H*.09); g.globalAlpha=1;
    g.font=`700 ${Math.round(s*1.5)}px ${MONO}`; g.fillStyle=main; g.globalAlpha=.8;
    const ch=slow?'◀':'▶', n=5, move=((t*(slow?-1:1)*rate*1.6)%1+1)%1;
    if(slow||fast) for(let i=0;i<n;i++){ const xx=mx+((i+move)/n)*mw; g.fillText(ch,xx,H*.19); }
    g.globalAlpha=1;
    label=`SCREW ${rate.toFixed(2)}x ${slow?'SLOW':fast?'FAST':''}`;
  }else{                                                                       // 通常：ビートに合わせて踊る
    const e=on?1:.9; drawDancer(g,cx,cy,s,dancePose(a0,e),core);
  }

  g.font=`700 10px ${MONO}`; g.textAlign='left'; g.textBaseline='bottom'; g.fillStyle=main; g.fillText(label,8,H-7);
}

// ===== Link：PIと同じ PeerJS 星型（MASTER=Beat がハブ、4桁ROOM、ping/pong時計合わせ）=====
// ?bc=1 を付けると同一端末内テスト用の BroadcastChannel で動く。時刻はすべて MASTER の performance.now (ms)。
const SYNC_PREFIX='bpl-';
const Link=(()=>{
  const L={role:null,code:'',offset:0,rtt:1e9,ready:false,conns:[],cache:{},id:Math.random().toString(36).slice(2,8),hub:null,onMsg(){},onStatus(){}};
  const BC=/[?&]bc=1/.test(location.search), now=()=>performance.now();
  L.masterNow=()=>now()+L.offset; L.toLocal=m=>m-L.offset;
  const keep=m=>{ if(m.type==='WORD'||m.type==='CLEAR') L.cache.DISP=m; else if(m.type==='FX') L.cache['FX'+m.k]=m; else if(m.type==='TIME'||m.type==='STOP') L.cache.TIME=m; else if(m.type==='POEM') L.cache.POEM=m; };
  L.send=m=>{ if(L.role==='host'){ keep(m); L.conns.forEach(c=>c.open&&c.send(m)); } else if(L.hub&&L.hub.open) L.hub.send(m); };
  const hostData=(c,m)=>{
    if(m.type==='PING'){ const t2=now(); c.send({type:'PONG',t1:m.t1,t2,t3:now()}); return; }
    if(m.type==='HELLO'){ c.role=m.role; Object.values(L.cache).forEach(x=>c.send(x)); L.onStatus('ROOM '+L.code+' · '+L.conns.length); return; }
    keep(m); L.conns.forEach(o=>o!==c&&o.open&&o.send(m)); L.onMsg(m);
  };
  L.host=(onMsg,onStatus)=>{
    L.role='host'; L.onMsg=onMsg; L.onStatus=onStatus;
    const code=String(1000+Math.floor(Math.random()*9000)); L.code=code;
    if(BC){ const bc=new BroadcastChannel('bpl-'+code), by={};
      bc.onmessage=e=>{ const d=e.data; if(d.to!=='host')return; let c=by[d.from]; if(!c){ c=by[d.from]={open:true,send:x=>bc.postMessage({to:d.from,msg:x})}; L.conns.push(c); } hostData(c,d.msg); };
      onStatus('ROOM '+code); return code; }
    const peer=new Peer(SYNC_PREFIX+code);
    peer.on('open',()=>onStatus('ROOM '+code));
    peer.on('connection',c=>{
      c.on('open',()=>{ L.conns.push(c); });
      c.on('data',m=>hostData(c,m));
      c.on('close',()=>{ L.conns=L.conns.filter(x=>x!==c); onStatus('ROOM '+code+' · '+L.conns.length); });
    });
    peer.on('error',e=>onStatus('ERR '+e.type));
    return code;
  };
  L.join=(code,role,onMsg,onStatus)=>{
    L.role=role; L.onMsg=onMsg; L.onStatus=onStatus; L.code=code;
    let n=0; const ping=()=>{ if(L.hub&&L.hub.open) L.hub.send({type:'PING',t1:now()}); setTimeout(ping,++n<12?250:2000); };
    const data=m=>{
      if(m.type==='PONG'){ const t4=now(), rtt=(t4-m.t1)-(m.t3-m.t2); L.rtt*=1.05;
        if(rtt<=L.rtt){ L.rtt=rtt; L.offset=((m.t2-m.t1)+(m.t3-t4))/2; L.ready=true; }
        onStatus('CONNECTED · RTT '+rtt.toFixed(0)+'ms'); return; }
      onMsg(m);
    };
    const up=()=>{ L.hub.send({type:'HELLO',role}); ping(); onStatus('CONNECTED'); };
    if(BC){ const bc=new BroadcastChannel('bpl-'+code); L.hub={open:true,send:x=>bc.postMessage({to:'host',from:L.id,msg:x})};
      bc.onmessage=e=>{ if(e.data.to===L.id) data(e.data.msg); }; up(); return; }
    const peer=new Peer();
    peer.on('open',()=>{ const c=peer.connect(SYNC_PREFIX+code,{reliable:true}); L.hub=c; c.on('open',up); c.on('data',data); c.on('close',()=>onStatus('DISCONNECTED')); });
    peer.on('error',e=>onStatus('ERR '+e.type));
  };
  return L;
})();

// ===== v38: 同期（MASTER=Beat。ROOMを作り、Poetry/Stageへ時間とイベントを送る）=====
function syncTime(){
  if(!Link.role||!ctx||!playing||!scratchBuf)return;
  const t0Ms=performance.now()+(t0-ctx.currentTime)*1000;      // ループ頭の時刻を MASTER の performance.now で表す
  Link.send({type:'TIME',t0Ms,bpm:BPM,loopSec:scratchBuf.duration/Math.max(.1,tempoRatio()),steps:totalStepsOf(activeSpec()),pat:currentPat});
}
let fxSent={}, fxLast=0, fxTimer=0;
function syncFx(){
  if(!Link.role)return;
  const nowT=performance.now();
  if(nowT-fxLast<45){ if(!fxTimer) fxTimer=setTimeout(()=>{fxTimer=0;syncFx();},60); return; }
  fxLast=nowT;
  const eng=isTtFxEngaged(), nf=f=>Math.log(f/30)/Math.log(18000/30);
  const cur={
    scr:{on:!!(ttSel.scr&&eng&&scratchingActive),v:dir*Math.min(1,Math.abs(velocity)/3)},
    rpt:{on:activeMomMode==='repeat',v:activeMomDiv},
    sttr:{on:activeMomMode==='stutter',v:activeMomDiv},
    screw:{on:!!state.screwActive,v:state.screwRate},
    lpf:{on:!!(xySel.lpf&&state.xyHolding),v:1-nf(state.lpfFreq)},
    hpf:{on:!!(xySel.hpf&&state.xyHolding),v:nf(state.hpfFreq)},
    bit:{on:!!(xySel.bit&&state.xyHolding),v:state.bitX,w:state.bitY},
    flg:{on:!!(xySel.flg&&state.xyHolding),v:state.flgDepth,w:state.flgRate}
  };
  for(const k in cur){
    const c=cur[k], s=JSON.stringify([c.on,+(+c.v||0).toFixed(2),+(+c.w||0).toFixed(2)]);
    if(fxSent[k]!==s){ fxSent[k]=s; Link.send({type:'FX',k,on:!!c.on,v:+c.v||0,w:+c.w||0}); }
  }
}
document.getElementById('syncBtn').addEventListener('click',()=>{

window.BeatSyncAPI={
  setBPM:(bpm)=>setBPM(bpm),
  setPhase:(phase)=>{
    if(!ctx||!playing||!scratchBuf)return;
    const p=((phase%1)+1)%1;
    const now=ctx.currentTime;
    setPhaseAnchor(p);
    lastLoopPhase=p;
    withPendingKept(()=>{
      scheduleBeat(now,p,true);
      if(!scratchingActive) startUwaNormal(now,p,true);
    });
  },
  triggerEvent:(type,payload={})=>{
    if(type==='PLAY') return startPlayback();
    if(type==='STOP') return stopPlayback();
    if(type==='BPM' && typeof payload.bpm==='number') return setBPM(payload.bpm);
    if(type==='PATTERN' && payload.pattern) return selectPattern(payload.pattern);
  },
  getState:()=>({ playing, pat:currentPat, queuedPat, bpm:BPM, ttSel:{...ttSel}, ttHoldEnabled:state.ttHoldEnabled, ttLatched:state.ttLatched, xySel:{...xySel}, xyHolding:state.xyHolding, phase:ctx&&scratchBuf?currentPhase():0 })
};

async function startPlayback(){
  if(playing)return;
  try{
    // 音声開始処理は必ずこのユーザー操作から直接行う。
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) throw new Error('Web Audio API is not supported');
      ctx=new AC({latencyHint:'interactive'});
      setupFxChain();
      bufferBPM=BPM; targetBPM=BPM;
      useBuffers(getPatBuffers(currentPat,BPM));
    }

    // Firefox/Chromeとも、START直後に確実にaudio contextをRUNNINGへ戻す。
    if(ctx.state!=='running') await ctx.resume();
    if(ctx.state!=='running') throw new Error('AudioContext is not running: '+ctx.state);

    playing=true;
    queuedPat=null;
    renderPatternUI();
    t0=ctx.currentTime+0.05;
    lastLoopPhase=0;
    scheduleBeat(t0,0,true);
    startUwaNormal(t0,0,true);
    togglePlayBtn.textContent='STOP';
    togglePlayBtn.classList.add('playing');
    statusEl.textContent=`PLAY [PAT ${currentPat}] BPM ${BPM}`;
    evaluateEffects();
    requestAnimationFrame(audioLoop);
    prewarmPatterns();
    syncTime();
  }catch(err){
    console.error('[BEAT AUDIO START]',err);
    playing=false;
    togglePlayBtn.textContent='START';
    togglePlayBtn.classList.remove('playing');
    statusEl.textContent='AUDIO ERROR: '+(err?.name||'ERROR')+' — '+(err?.message||'START failed');
  }
}

function stopPlayback(){
  if(!playing)return;
  playing=false;
  Link.send({type:'STOP'});
  dragging=false;
  state.ttLatched=false;
  ttDeltaAngle=0;
  scratchingActive=false;
  state.xyDragging=false;
  state.screwActive=false;
  queuedPat=null;
  pendingSwitch=null;
  updateXyVisual();
  stopMomentaryAudio();
  renderPatternUI();
  scrStop();
  stopUwaNormal();
  stopBeatSrc();
  evaluateEffects();
  togglePlayBtn.textContent='START';
  togglePlayBtn.classList.remove('playing');
  phaseEl.textContent='0.00';
  statusEl.textContent='STOP — STARTを押すと再開します';
}

});

patButtons.forEach(btn=>{
  btn.addEventListener('click',()=>selectPattern(btn.dataset.pat));
});

bpmSlider.addEventListener('input',()=>setBPM(Number(bpmSlider.value)));

platter.addEventListener('pointerdown',beginScratch,{passive:false});
platter.addEventListener('pointermove',moveScratch,{passive:false});
platter.addEventListener('pointerup',endScratch,{passive:false});
platter.addEventListener('pointercancel',endScratch,{passive:false});
platter.addEventListener('lostpointercapture',endScratch,{passive:false});
platter.addEventListener('contextmenu',e=>e.preventDefault());

updateMonitors();
</script>
</body>
</html>
